<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梨 出荷時期タイムライン</title><style>:root{--text:#2c2c2b;--muted:#777;--line:#e6e5e3;--soft:#f9f8f7;--green:#46a171;--red:#e56458}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif;color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:20px;font-weight:900}.sub,.hint,.status{font-size:12px;color:var(--muted)}select,input,textarea{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px;width:100%}button{border:0;border-radius:9px;color:#fff;font-weight:900;padding:9px;cursor:pointer}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:10px 0;flex-wrap:wrap}.tab{border:1px solid var(--line);border-bottom:0;background:#fff;color:var(--text);border-radius:10px 10px 0 0;padding:9px 14px}.tab.active{background:#e8f1ec;color:#246947}.main{display:grid;grid-template-columns:1fr 270px;gap:10px}.board,.editor,.listBox{border:1px solid var(--line);border-radius:14px;padding:12px}.months{display:grid;grid-template-columns:118px 56px repeat(5,1fr);font-size:12px;color:#5f5c57;margin-bottom:8px;font-weight:900;align-items:center}.months span:nth-child(n+3){text-align:center}.row{display:grid;grid-template-columns:118px 56px 1fr;gap:8px;align-items:center;margin:7px 0}.label{font-size:13px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.commentCol{display:flex;justify-content:center;align-items:center}.commentBtn{display:inline-flex;align-items:center;gap:3px;justify-content:center;min-width:44px;height:26px;background:#fff;border:1px solid #b7d4c2;border-radius:999px;padding:0 7px;font-size:12px;font-weight:900;color:#266546;box-shadow:0 1px 3px rgba(0,0,0,.14);cursor:pointer}.commentBtn.zero{color:#999;border-color:#ddd}.commentBtn:hover{background:#f0faf4}.track{position:relative;height:38px;background:linear-gradient(90deg,#fff 0,#fff 19.8%,#f5f4f2 20%,#f5f4f2 20.4%,#fff 20.6%,#fff 39.8%,#f5f4f2 40%,#f5f4f2 40.4%,#fff 40.6%,#fff 59.8%,#f5f4f2 60%,#f5f4f2 60.4%,#fff 60.6%,#fff 79.8%,#f5f4f2 80%,#f5f4f2 80.4%,#fff 80.6%);border:1px solid var(--line);border-radius:9px}.bar{position:absolute;top:8px;height:22px;border-radius:999px;background:linear-gradient(90deg,#72bc8f,#5e9fe8);cursor:pointer}.dateTag{position:absolute;top:-1px;transform:translateX(-50%);background:#fff;border:1px solid #cfded5;border-radius:7px;padding:2px 5px;font-size:11px;font-weight:900;color:#25533d;white-space:nowrap}.dateTag.end{color:#23527f;border-color:#cbdceb}.form{display:grid;gap:7px}.save{background:var(--green)}.clear{background:#8f8b85}.delete{background:var(--red)}.restore{background:#2783de}.listBox{margin-top:10px}.list{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}.pill{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px;cursor:pointer}.empty{padding:18px;background:var(--soft);border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}.modal{border:1px solid var(--line);border-radius:14px;padding:0;max-width:520px;width:calc(100% - 28px)}.modal::backdrop{background:rgba(0,0,0,.25)}.inner{padding:16px}.inner h3{margin:0 0 10px}.inner label{display:block;margin:10px 0 4px;font-size:12px;color:var(--muted);font-weight:800}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.comment{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:6px;cursor:pointer}.comment:hover{border-color:#b7d4c2;background:#fbfffc}.comment p{margin:3px 0 0;white-space:pre-wrap}.modal button{background:#8f8b85}.modal .primary,#saveCommentBtn{background:var(--green)!important}.danger{color:#b73a30!important}.hidden{display:none!important}@media(max-width:900px){.main{grid-template-columns:1fr}.list{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.top{display:block}.months{grid-template-columns:82px 44px repeat(5,1fr)}.row{grid-template-columns:82px 44px 1fr}.list{grid-template-columns:1fr}.tab{white-space:nowrap}.commentBtn{min-width:38px;height:24px;font-size:11px;padding:0 5px}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">🍐 梨 出荷時期タイムライン</div><div class="sub">期間バークリックで編集。コメント列の💬数字ボタンでコメントの確認・追加・編集ができます。</div><div id="status" class="status">共有データを読み込み中...</div></div><div style="display:flex;gap:8px"><select id="mode"><option value="this">今年</option><option value="last">去年</option><option value="year">すべて</option></select><select id="yearPick" style="display:none"></select></div></div><nav id="tabs" class="tabs"></nav><div class="main"><div class="board"><div class="months"><span>品種</span><span>コメント</span><span>8月</span><span>9月</span><span>10月</span><span>11月</span><span>12月</span></div><div id="timeline"></div></div><aside class="editor"><b id="formTitle">ライン編集</b><div class="form" style="margin-top:8px"><select id="src"></select><select id="variety"></select><input id="start" type="date"><input id="end" type="date"><button class="save" id="saveBtn">保存</button><button class="delete" id="hideBtn">削除（非表示）</button><button class="clear" id="clearBtn">選択解除</button><select id="hiddenPick"></select><button class="restore" id="restoreBtn">選んだ削除を戻す</button><button class="clear" id="resetBtn">再読み込み</button><div id="msg" class="hint"></div></div><p class="hint">バー本体＝編集、💬数字ボタン＝コメントです。</p></aside></div><section class="listBox"><b id="listTitle">表示中リスト</b><div id="list" class="list"></div></section></div><dialog id="commentDlg" class="modal"><div class="inner"><h3 id="commentTitle">コメント</h3><input type="hidden" id="commentIndex"><div id="commentList"></div><label>名前</label><input id="commentName" placeholder="記入者名"><label>コメント</label><textarea id="commentText" rows="3" placeholder="コメントを入力"></textarea><div class="actions"><button id="deleteCommentBtn" class="danger hidden">コメント削除</button><button id="closeCommentBtn">閉じる</button><button id="clearCommentBtn">新規入力</button><button id="saveCommentBtn" class="primary">コメント保存</button></div><div class="hint">既存コメントを修正・削除する場合は、上のコメントをクリックしてください。</div></div></dialog><script>const API='https://flat-disk-51b0.sasaki-8ef.workers.dev';const nowYear=new Date().getFullYear(),sources=['JAいなば','JA琴浦','JA米子','千疋屋','広岡農場'],hiro=['秋栄','新甘泉','二十世紀梨','あきづき','新興梨','王秋','輝太郎柿'],other=['秋栄','新甘泉','二十世紀梨','秋甘泉','王秋','あいみ燦ゴールド','輝太郎'];let active='JAいなば',detailId='',rowsData=[];function vars(s=active){return s==='広岡農場'?hiro:other}function targetYear(){return mode.value==='this'?nowYear:mode.value==='last'?nowYear-1:+yearPick.value}function d(x){return new Date(x+'T00:00:00')}function md(x){let t=d(x);return `${t.getMonth()+1}/${t.getDate()}`}function pos(date){let dt=d(date),y=dt.getFullYear(),min=d(y+'-08-01'),max=d(y+'-12-31');return Math.max(0,Math.min(100,(dt-min)/(max-min)*100))}async function api(path,opt={}){let r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error(await r.text());return r.json()}async function loadData(){try{status.textContent='共有データを読み込み中...';let data=await api('/timeline/data');rowsData=(data.rows||[]).map(x=>({...x,year:+x.year,hidden:+x.hidden||0,comments:x.comments||[]}));status.textContent='共有データで表示中';render()}catch(e){status.textContent='読み込みエラー：'+e.message}}function years(){let ys=new Set([nowYear,nowYear-1,2026,2025]);rowsData.forEach(r=>ys.add(+r.year));return [...ys].sort((a,b)=>b-a)}function rowId(s,v,y){return [s,v,y].join('|')}function renderYearPick(){let cur=yearPick.value||String(nowYear),ys=years();yearPick.innerHTML=ys.map(y=>`<option value="${y}">${y}年</option>`).join('');yearPick.value=ys.includes(+cur)?cur:String(nowYear);yearPick.style.display=mode.value==='year'?'block':'none'}function displayRows(){let y=targetYear();return rowsData.filter(r=>r.source===active&&+r.year===y&&!r.hidden).sort((a,b)=>a.start.localeCompare(b.start))}function hiddenRows(){let y=targetYear();return rowsData.filter(r=>r.source===active&&+r.year===y&&r.hidden)}function renderHiddenPick(){let hs=hiddenRows();hiddenPick.innerHTML=hs.length?hs.map(x=>`<option value="${x.id}">${x.variety}（${x.year}年）</option>`).join(''):'<option value="">削除済みなし</option>';restoreBtn.disabled=!hs.length}function render(){renderYearPick();renderHiddenPick();tabs.innerHTML=sources.map(s=>`<button class="tab ${s===active?'active':''}" data-s="${s}">${s}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.s;src.value=active;fillVariety();render()});let r=displayRows();timeline.innerHTML=r.length?r.map((x,i)=>{let l=pos(x.start),w=Math.max(6,pos(x.end)-pos(x.start)),c=(x.comments||[]).length;return `<div class="row"><div class="label">${x.variety}</div><div class="commentCol"><button class="commentBtn ${c?'':'zero'}" data-i="${i}" type="button">💬<span>${c}</span></button></div><div class="track"><div class="bar" data-i="${i}" style="left:${l}%;width:${w}%"></div><span class="dateTag" style="left:${l}%">${md(x.start)}</span><span class="dateTag end" style="left:${l+w}%">${md(x.end)}</span></div></div>`}).join(''):`<div class="empty">${targetYear()}年の出荷時期は未登録、または削除済みです。</div>`;timeline.querySelectorAll('.bar').forEach(b=>b.onclick=()=>editRow(r[+b.dataset.i]));timeline.querySelectorAll('.commentBtn').forEach(b=>b.onclick=e=>{e.stopPropagation();openComments(r[+b.dataset.i])});listTitle.textContent=`${active}｜${targetYear()}年リスト`;list.innerHTML=r.length?r.map((x,i)=>`<div class="pill" data-i="${i}"><b>${x.variety}</b><br>${md(x.start)}〜${md(x.end)} 💬${(x.comments||[]).length}</div>`).join(''):`<div class="empty">データなし</div>`;list.querySelectorAll('.pill').forEach(p=>p.onclick=()=>editRow(r[+p.dataset.i]))}function fillVariety(){variety.innerHTML=vars(src.value).map(v=>`<option>${v}</option>`).join('')}function editRow(r){src.value=r.source;fillVariety();variety.value=r.variety;start.value=r.start;end.value=r.end;formTitle.textContent='編集中：'+r.variety;formTitle.dataset.id=r.id;render()}function clearForm(){formTitle.dataset.id='';src.value=active;fillVariety();variety.value=vars(active)[0];let y=targetYear();start.value=`${y}-08-01`;end.value=`${y}-08-31`;formTitle.textContent='ライン編集';render()}function showMsg(t){msg.textContent=t;setTimeout(()=>msg.textContent='',2200)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openComments(r){detailId=r.id;commentTitle.textContent=`コメント：${r.source} ${r.variety}`;commentName.value='';commentText.value='';commentIndex.value='';deleteCommentBtn.classList.add('hidden');drawComments();commentDlg.showModal()}function drawComments(){let r=rowsData.find(x=>x.id===detailId),arr=(r&&r.comments)||[];commentList.innerHTML=arr.length?arr.map((c,i)=>`<div class="comment" data-i="${i}"><b>${esc(c.name)}</b><p>${esc(c.text)}</p></div>`).join(''):'<div class="hint">コメントなし</div>';commentList.querySelectorAll('.comment').forEach(el=>el.onclick=()=>{let c=arr[+el.dataset.i];commentIndex.value=el.dataset.i;commentName.value=c.name;commentText.value=c.text;deleteCommentBtn.classList.remove('hidden')})}src.innerHTML=sources.map(s=>`<option>${s}</option>`).join('');src.value=active;fillVariety();src.onchange=fillVariety;mode.onchange=clearForm;yearPick.onchange=clearForm;saveBtn.onclick=async()=>{if(!start.value||!end.value)return showMsg('開始日と終了日を入れてください');if(end.value<start.value)return showMsg('終了日は開始日以降にしてください');let yr=+start.value.slice(0,4),id=formTitle.dataset.id||rowId(src.value,variety.value,yr),old=rowsData.find(r=>r.id===id);let body={id,source:src.value,variety:variety.value,year:yr,start:start.value,end:end.value,hidden:0,comments:old?.comments||[]};if(old)await api('/timeline/rows/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(body)});else await api('/timeline/rows',{method:'POST',body:JSON.stringify(body)});active=src.value;showMsg('保存しました');await loadData();clearForm()};hideBtn.onclick=async()=>{let id=formTitle.dataset.id||rowId(src.value,variety.value,(start.value||`${targetYear()}-01-01`).slice(0,4)),old=rowsData.find(r=>r.id===id);if(!old)return showMsg('保存済みデータを選択してください');old.hidden=1;await api('/timeline/rows/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(old)});showMsg('削除しました');await loadData();clearForm()};restoreBtn.onclick=async()=>{let id=hiddenPick.value,old=rowsData.find(r=>r.id===id);if(old){old.hidden=0;await api('/timeline/rows/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(old)});showMsg('戻しました');await loadData();clearForm()}};resetBtn.onclick=loadData;clearBtn.onclick=clearForm;saveCommentBtn.onclick=async()=>{let r=rowsData.find(x=>x.id===detailId);if(!r)return;if(!commentName.value||!commentText.value)return alert('名前とコメントを入力してください');let data={name:commentName.value,text:commentText.value};r.comments=r.comments||[];if(commentIndex.value==='')r.comments.push(data);else r.comments[+commentIndex.value]=data;await api('/timeline/rows/'+encodeURIComponent(r.id)+'/comments',{method:'PUT',body:JSON.stringify({comments:r.comments})});commentName.value='';commentText.value='';commentIndex.value='';deleteCommentBtn.classList.add('hidden');await loadData();drawComments()};deleteCommentBtn.onclick=async()=>{let r=rowsData.find(x=>x.id===detailId);if(r&&commentIndex.value!==''){r.comments.splice(+commentIndex.value,1);await api('/timeline/rows/'+encodeURIComponent(r.id)+'/comments',{method:'PUT',body:JSON.stringify({comments:r.comments})});commentName.value='';commentText.value='';commentIndex.value='';deleteCommentBtn.classList.add('hidden');await loadData();drawComments()}};clearCommentBtn.onclick=()=>{commentIndex.value='';commentName.value='';commentText.value='';deleteCommentBtn.classList.add('hidden')};closeCommentBtn.onclick=()=>commentDlg.close();loadData();</script></body></html>
