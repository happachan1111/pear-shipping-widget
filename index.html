<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梨 出荷時期タイムライン</title><style>:root{--text:#2c2c2b;--muted:#7d7a75;--line:#e6e5e3;--soft:#f9f8f7;--green:#46a171;--blue:#2783de;--red:#e56458}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Segoe UI',sans-serif}.wrap{max-width:1180px;margin:auto;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.title{font-size:20px;font-weight:800}.sub{font-size:12px;color:var(--muted)}.selectors{display:flex;gap:8px;align-items:center}.sel{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 10px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-bottom:0;background:white;border-radius:10px 10px 0 0;padding:9px 14px;cursor:pointer;font-size:13px;min-height:40px}.tab.active{background:#e8f1ec;border-color:#acd1ba;color:#246947;font-weight:800}.main{display:grid;grid-template-columns:1fr 260px;gap:10px}.board{border:1px solid var(--line);border-radius:14px;padding:12px}.months{display:grid;grid-template-columns:128px repeat(5,1fr);font-size:12px;color:#5f5c57;margin-bottom:8px;font-weight:800}.months span:not(:first-child){text-align:center}.row{display:grid;grid-template-columns:128px 1fr;gap:8px;align-items:center;margin:7px 0}.label{font-size:13px;font-weight:800}.track{position:relative;height:34px;background:linear-gradient(90deg,#fff 0,#fff 19.8%,#f5f4f2 20%,#f5f4f2 20.4%,#fff 20.6%,#fff 39.8%,#f5f4f2 40%,#f5f4f2 40.4%,#fff 40.6%,#fff 59.8%,#f5f4f2 60%,#f5f4f2 60.4%,#fff 60.6%,#fff 79.8%,#f5f4f2 80%,#f5f4f2 80.4%,#fff 80.6%);border:1px solid var(--line);border-radius:9px;overflow:hidden}.bar{position:absolute;top:6px;height:22px;border-radius:999px;background:linear-gradient(90deg,#72bc8f,#5e9fe8);cursor:pointer}.dateTag{position:absolute;top:-1px;transform:translateX(-50%);background:#fff;border:1px solid #cfded5;border-radius:7px;padding:2px 5px;font-size:11px;font-weight:900;color:#25533d;white-space:nowrap}.dateTag.end{color:#23527f;border-color:#cbdceb}.empty{padding:18px;background:var(--soft);border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}.editor{border:1px solid var(--line);border-radius:14px;padding:12px;align-self:start;position:sticky;top:8px}.editor h2{font-size:14px;margin:0 0 8px}.form{display:grid;gap:7px}.form input,.form select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}.form button{border:0;border-radius:9px;color:#fff;font-weight:800;padding:9px;cursor:pointer}.save{background:var(--green)}.clear{background:#8f8b85}.delete{background:var(--red)}.restore{background:#2783de}.hint{font-size:11px;color:var(--muted);line-height:1.45}.msg{font-size:12px;font-weight:800;color:#246947;min-height:18px}.listBox{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}.listBox h2{font-size:14px;margin:0 0 8px}.list{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}.pill{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px;cursor:pointer}.pill.active{outline:2px solid #acd1ba;background:#eef7f1}.sep{height:1px;background:var(--line);margin:4px 0}@media(max-width:900px){.main{grid-template-columns:1fr}.editor{position:static}.list{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.top{display:block}.selectors{margin-top:8px}.tabs{overflow:auto;flex-wrap:nowrap}.months{grid-template-columns:96px repeat(5,1fr)}.row{grid-template-columns:96px 1fr}.list{grid-template-columns:1fr}.tab{white-space:nowrap}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">🍐 梨 出荷時期タイムライン</div><div class="sub">広岡農場2025年の実績を反映しました。年・出荷元タブで切り替えできます。</div></div><div class="selectors"><select id="mode" class="sel"><option value="this">今年</option><option value="last">去年</option><option value="year">すべて</option></select><select id="yearPick" class="sel" style="display:none"></select></div></div><nav id="tabs" class="tabs"></nav><div class="main"><div class="board"><div class="months"><span>品種</span><span>8月</span><span>9月</span><span>10月</span><span>11月</span><span>12月</span></div><div id="timeline"></div></div><aside class="editor"><h2 id="formTitle">ライン編集</h2><div class="form"><select id="src"></select><select id="variety"></select><input id="start" type="date"><input id="end" type="date"><button class="save" type="button" id="saveBtn">保存</button><button class="delete" type="button" id="hideBtn">削除（この年だけ非表示）</button><button class="clear" type="button" id="clearBtn">選択解除</button><div class="sep"></div><select id="hiddenPick"></select><button class="restore" type="button" id="restoreBtn">選んだ削除を戻す</button><div id="msg" class="msg"></div></div><p class="hint">開始日と終了日を入れて保存してください。保存後すぐ反映されます。</p></aside></div><section class="listBox"><h2 id="listTitle">表示中リスト</h2><div id="list" class="list"></div></section></div><script>const nowYear=new Date().getFullYear();const sources=['JAいなば','JA琴浦','JA米子','千疋屋','広岡農場'];const hiro=['秋栄','新甘泉','二十世紀梨','あきづき','新興梨','王秋','輝太郎柿'];const other=['秋栄','新甘泉','二十世紀梨','秋甘泉','王秋','あいみ燦ゴールド','輝太郎'];const seed={'秋栄':{'2026':['2026-08-24','2026-09-05'],'2025':['2025-08-26','2025-09-11']},'新甘泉':{'2026':['2026-08-28','2026-09-18'],'2025':['2025-08-28','2025-09-18']},'二十世紀梨':{'2026':['2026-09-08','2026-09-25'],'2025':['2025-09-08','2025-09-25']},'あきづき':{'2026':['2026-09-20','2026-09-28'],'2025':['2025-09-20','2025-09-28']},'新興梨':{'2026':['2026-10-15','2026-11-28'],'2025':['2025-10-15','2025-11-28']},'王秋':{'2026':['2026-11-10','2026-12-26'],'2025':['2025-11-10','2025-12-26']},'輝太郎柿':{'2026':['2026-10-10','2026-11-05'],'2025':['2025-10-10','2025-11-05']},'秋甘泉':{'2026':['2026-09-01','2026-09-16'],'2025':['2025-09-01','2025-09-16']},'あいみ燦ゴールド':{'2026':['2026-09-25','2026-10-15'],'2025':['2025-09-25','2025-10-15']},'輝太郎':{'2026':['2026-10-10','2026-11-05'],'2025':['2025-10-10','2025-11-05']}};let active='JAいなば',editing=null;let edits=JSON.parse(localStorage.getItem('pearAutoYearEditsV3')||localStorage.getItem('pearAutoYearEditsV2')||'{}');let hidden=JSON.parse(localStorage.getItem('pearAutoYearHiddenV3')||localStorage.getItem('pearAutoYearHiddenV2')||'{}');const seedSrc={'広岡農場':{'二十世紀梨':{'2025':['2025-09-08','2025-09-25']},'秋栄':{'2025':['2025-08-26','2025-09-11']},'あきづき':{'2025':['2025-09-20','2025-10-10']},'王秋':{'2025':['2025-11-05','2025-12-26']},'新甘泉':{'2025':['2025-08-28','2025-09-18']},'新興梨':{'2025':['2025-10-15','2025-11-28']}}};function vars(s=active){return s==='広岡農場'?hiro:other}function targetYear(){return mode.value==='this'?nowYear:mode.value==='last'?nowYear-1:+yearPick.value}function key(source,variety,year){return [source,variety,year].join('|')}function d(x){return new Date(x+'T00:00:00')}function md(x){let t=d(x);return `${t.getMonth()+1}/${t.getDate()}`}function rows(){let y=targetYear(), arr=[];vars().forEach(v=>{let k=key(active,v,y);if(hidden[k])return;let p=(((seedSrc[active]||{})[v]||{})[y])||(seed[v]||{})[y], e=edits[k];if(e)arr.push({...e});else if(p)arr.push({source:active,variety:v,start:p[0],end:p[1]});});return arr.sort((a,b)=>a.start.localeCompare(b.start))}function pos(date){let dt=d(date), y=dt.getFullYear(), min=d(y+'-08-01'), max=d(y+'-12-31');return Math.max(0,Math.min(100,(dt-min)/(max-min)*100))}function years(){let ys=new Set([nowYear,nowYear-1,2026,2025]);Object.values(edits).forEach(e=>ys.add(+e.start.slice(0,4)));Object.keys(hidden).forEach(k=>ys.add(+k.split('|')[2]));return [...ys].sort((a,b)=>b-a)}function showMsg(t){msg.textContent=t;setTimeout(()=>{msg.textContent=''},2500)}function renderYearPick(){yearPick.innerHTML=years().map(y=>`<option value="${y}">${y}年</option>`).join('');if(!yearPick.value)yearPick.value=nowYear;yearPick.style.display=mode.value==='year'?'block':'none'}function renderHiddenPick(){let y=targetYear();let items=Object.keys(hidden).filter(k=>hidden[k]).map(k=>{let [s,v,yr]=k.split('|');return{k,s,v,yr}}).filter(x=>x.s===active&&+x.yr===y);hiddenPick.innerHTML=items.length?items.map(x=>`<option value="${x.k}">${x.v}（${x.yr}年）</option>`).join(''):'<option value="">削除済みなし</option>';restoreBtn.disabled=!items.length;restoreBtn.style.opacity=items.length?1:.55}function render(){renderYearPick();renderHiddenPick();tabs.innerHTML=sources.map(s=>`<button class="tab ${s===active?'active':''}" data-s="${s}">${s}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.s;src.value=active;fillVariety();editing=null;render()});let r=rows();timeline.innerHTML=r.length?r.map((x,i)=>{let l=pos(x.start),w=Math.max(3,pos(x.end)-pos(x.start));return `<div class="row"><div class="label">${x.variety}</div><div class="track"><div class="bar" data-i="${i}" style="left:${l}%;width:${w}%"></div><span class="dateTag" style="left:${l}%">${md(x.start)}</span><span class="dateTag end" style="left:${l+w}%">${md(x.end)}</span></div></div>`}).join(''):`<div class="empty">${targetYear()}年の出荷時期は未登録、または削除済みです。</div>`;timeline.querySelectorAll('.bar').forEach(b=>b.onclick=()=>editRow(r[+b.dataset.i]));listTitle.textContent=`${active}｜${targetYear()}年リスト`;list.innerHTML=r.length?r.map((x,i)=>`<div class="pill ${editing===key(x.source,x.variety,x.start.slice(0,4))?'active':''}" data-i="${i}"><b>${x.variety}</b><br>${md(x.start)}〜${md(x.end)}</div>`).join(''):`<div class="empty">データなし</div>`;list.querySelectorAll('.pill').forEach(p=>p.onclick=()=>editRow(r[+p.dataset.i]))}function fillVariety(){variety.innerHTML=vars(src.value).map(v=>`<option>${v}</option>`).join('')}function editRow(r){editing=key(r.source,r.variety,r.start.slice(0,4));src.value=r.source;fillVariety();variety.value=r.variety;start.value=r.start;end.value=r.end;formTitle.textContent='編集中：'+r.variety;render()}function clearForm(){editing=null;src.value=active;fillVariety();variety.value=vars(active)[0];let y=targetYear();start.value=`${y}-08-01`;end.value=`${y}-08-31`;formTitle.textContent='ライン編集';render()}function persist(){localStorage.setItem('pearAutoYearEditsV3',JSON.stringify(edits));localStorage.setItem('pearAutoYearHiddenV3',JSON.stringify(hidden));localStorage.setItem('pearAutoYearEditsV2',JSON.stringify(edits));localStorage.setItem('pearAutoYearHiddenV2',JSON.stringify(hidden))}src.innerHTML=sources.map(s=>`<option>${s}</option>`).join('');src.value=active;fillVariety();src.onchange=fillVariety;mode.onchange=()=>{editing=null;clearForm()};yearPick.onchange=()=>{editing=null;clearForm()};saveBtn.onclick=()=>{if(!start.value||!end.value){showMsg('開始日と終了日を入れてください');return}if(end.value<start.value){showMsg('終了日は開始日以降にしてください');return}let yr=start.value.slice(0,4),k=key(src.value,variety.value,yr);edits[k]={source:src.value,variety:variety.value,start:start.value,end:end.value};delete hidden[k];persist();active=src.value;showMsg('保存しました');clearForm()};hideBtn.onclick=()=>{let yr=(start.value||`${targetYear()}-01-01`).slice(0,4),k=key(src.value,variety.value,yr);hidden[k]=true;delete edits[k];persist();showMsg('削除しました');clearForm()};restoreBtn.onclick=()=>{let k=hiddenPick.value;if(k){delete hidden[k];persist();showMsg('戻しました');clearForm()}};clearBtn.onclick=clearForm;clearForm();</script></body></html>
