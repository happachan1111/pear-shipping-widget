<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>梨 受注締切カレンダー</title>
<style>
:root{--bg:#fff;--surface:#f9f8f7;--line:#e6e5e3;--text:#2c2c2b;--muted:#7d7a75;--green:#46a171;--greenSoft:#e8f1ec;--orange:#d5803b;--orangeSoft:#fbebde;--blue:#2783de;--blueSoft:#e5f2fc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Hiragino Sans",Meiryo,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:980px;margin:0 auto;padding:18px}.head{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.title{display:flex;gap:10px;align-items:center}.icon{width:42px;height:42px;border-radius:12px;background:var(--greenSoft);display:grid;place-items:center;font-size:24px}.title h1{font-size:22px;margin:0}.title p{margin:4px 0 0;color:var(--muted);font-size:13px}.controls{display:flex;gap:8px;align-items:center}.controls button,.add button,.actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer;color:var(--text);min-height:40px}.controls button:hover,.add button:hover,.actions button:hover{background:var(--surface)}#monthLabel{font-weight:800;min-width:110px;text-align:center}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{font-size:12px;color:var(--muted);font-weight:700;text-align:center;padding:6px}.day{min-height:82px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px;position:relative;transition:background .12s,border-color .12s}.day:not(.other){cursor:copy}.day:not(.other):hover{background:var(--greenSoft);border-color:rgba(70,161,113,.45)}.day.other{background:var(--surface);color:#aaa}.num{font-size:12px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between;align-items:center}.add-mark{font-size:10px;font-weight:800;color:var(--green);opacity:0}.day:hover .add-mark{opacity:1}.today{border-color:var(--green);box-shadow:0 0 0 2px var(--greenSoft) inset}.item{margin-top:5px;padding:5px 6px;border-radius:7px;background:var(--greenSoft);border-left:3px solid var(--green);font-size:12px;line-height:1.25;cursor:pointer}.item:hover{filter:brightness(.98)}.item .src{display:block;color:var(--muted);font-size:10px;margin-top:2px}.seq{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;margin-right:3px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:10px;font-weight:800;color:var(--text)}.item.soon{background:#fff7ed;outline:2px solid #d5803b;outline-offset:-2px}.item.soon b:after{content:' 締切近い';display:inline-block;margin-left:4px;padding:1px 4px;border-radius:4px;background:#d5803b;color:#fff;font-size:9px;font-weight:800}.item.lastyear{background:var(--blueSoft);border-left-color:var(--blue);cursor:default}.item.src-hirooka{border-left-color:#46a171}.item.src-senbikiya{border-left-color:#9b6bc6}.item.src-inaba{border-left-color:#2783de}.item.src-yonago{border-left-color:#d5803b}.item.src-kotoura{border-left-color:#df84a8}.panel{margin-top:14px;display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}.card h2{font-size:14px;margin:0 0 10px}.add{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}.add input,.add select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;font-size:14px;min-height:40px}.legend{display:flex;gap:8px;flex-wrap:wrap}.pill{font-size:12px;padding:6px 8px;border-radius:999px;background:#fff;border:1px solid var(--line)}.upcoming{display:grid;gap:7px}.uprow{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px}.uprow b{font-size:13px}.uprow span{font-size:12px;color:var(--muted)}.hint{font-size:12px;color:var(--muted);margin-top:9px}dialog{border:1px solid var(--line);border-radius:12px;padding:0;max-width:380px;width:calc(100% - 32px)}dialog::backdrop{background:rgba(44,44,43,.24)}.modal{padding:16px}.modal h3{margin:0 0 12px}.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}.modal input,.modal select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.danger{color:#b73a30!important}.hidden{display:none!important}@media(max-width:760px){.head,.panel{display:block}.controls{margin-top:12px;flex-wrap:wrap}.grid{gap:4px}.day{min-height:70px;padding:5px}.add{grid-template-columns:1fr}.item{font-size:11px}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="title"><div class="icon">🍐</div><div><h1>梨 受注締切カレンダー</h1><p>品種ごとの締切日を追加・編集できます（この端末のブラウザに保存）</p></div></div><div class="controls"><button id="prev">‹</button><div id="monthLabel"></div><button id="next">›</button><button id="thisMonth">今月</button><button id="lastYear">去年</button></div></div>
  <div class="grid" id="calendar"></div>
  <div class="panel"><div class="card"><h2>締切を追加</h2><div class="add"><select id="source"><option value="">① 出荷元を選択</option><option>広岡農場</option><option>千疋屋</option><option>JAいなば</option><option>JA米子</option><option>JA琴浦</option></select><select id="variety"><option value="">② 品種を選択</option></select><input id="date" type="date"><button id="addBtn">追加</button></div><div class="hint">日付をダブルクリックしても、その日付で締切を追加できます。登録済みの予定はクリックで編集・削除できます。</div><div class="legend" style="margin-top:10px"><span class="pill">広岡農場＝緑</span><span class="pill">千疋屋＝紫</span><span class="pill">JAいなば＝青</span><span class="pill">JA米子＝オレンジ</span><span class="pill">JA琴浦＝ピンク</span></div></div><div class="card"><h2>直近の締切</h2><div class="upcoming" id="upcoming"></div></div></div>
</div>
<dialog id="dlg"><div class="modal"><h3 id="modalTitle">締切を編集</h3><input type="hidden" id="editId"><label>① 出荷元</label><select id="editSource"><option value="">出荷元を選択</option><option>広岡農場</option><option>千疋屋</option><option>JAいなば</option><option>JA米子</option><option>JA琴浦</option></select><label>② 品種</label><select id="editVariety"><option value="">品種を選択</option></select><label>締切日</label><input id="editDate" type="date"><div class="actions"><button id="deleteBtn" class="danger">削除</button><button id="cancelBtn">閉じる</button><button id="saveBtn">保存</button></div></div></dialog>
<script>
const seed=[{id:'s1',variety:'新甘泉',source:'広岡農場',date:'2026-08-25'},{id:'s2',variety:'二十世紀梨',source:'JAいなば',date:'2026-09-02'},{id:'s3',variety:'秋栄',source:'JA琴浦',date:'2026-09-08'},{id:'p1',variety:'新甘泉（去年）',source:'広岡農場',date:'2025-08-25'},{id:'p2',variety:'二十世紀梨（去年）',source:'JAいなば',date:'2025-09-02'},{id:'p3',variety:'秋栄（去年）',source:'JA琴浦',date:'2025-09-08'}];
const sourceClass=s=>({'広岡農場':'src-hirooka','千疋屋':'src-senbikiya','JAいなば':'src-inaba','JA米子':'src-yonago','JA琴浦':'src-kotoura'}[s]||'');
const varieties={hirooka:['新甘泉','二十世紀','あきづき','秋栄','王秋','新興梨','輝太郎'],other:['新甘泉','二十世紀','秋栄','秋甘泉','王秋','あいみ燦ゴールド','輝太郎']};
function optionsFor(src){return src==='広岡農場'?varieties.hirooka:(src?varieties.other:[])}
function fillVarietySelect(sel,src,val=''){const list=optionsFor(src);sel.disabled=!src;sel.innerHTML='<option value="">② 品種を選択</option>'+list.map(v=>`<option ${v===val?'selected':''}>${v}</option>`).join('');if(val&&!list.includes(val)){sel.insertAdjacentHTML('beforeend',`<option selected>${val}</option>`)}}
let items=JSON.parse(localStorage.getItem('nashiDeadlines')||'null')||seed;let view=new Date();view.setDate(1);const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function save(){localStorage.setItem('nashiDeadlines',JSON.stringify(items))}function sameYearSourceVarietyGroup(item){const y=item.date.slice(0,4);return items.filter(x=>x.source===item.source&&x.variety===item.variety&&x.date.slice(0,4)===y).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id))}function displayVariety(item){const group=sameYearSourceVarietyGroup(item);if(!item.source||!item.variety||group.length<2)return item.variety;const n=group.findIndex(x=>x.id===item.id)+1;const marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];return `${item.variety}${marks[n-1]||`(${n})`}`}function render(){document.getElementById('monthLabel').textContent=`${view.getFullYear()}年 ${view.getMonth()+1}月`;const cal=document.getElementById('calendar');cal.innerHTML='';['日','月','火','水','木','金','土'].forEach(x=>cal.insertAdjacentHTML('beforeend',`<div class="dow">${x}</div>`));const start=new Date(view);start.setDate(1-start.getDay());const today=fmt(new Date());for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=fmt(d);const el=document.createElement('div');el.className='day'+(d.getMonth()!=view.getMonth()?' other':'')+(ds==today?' today':'');el.innerHTML=`<div class="num"><span>${d.getDate()}</span>${d.getMonth()==view.getMonth()?'<span class="add-mark">＋追加</span>':''}</div>`;if(d.getMonth()==view.getMonth()){el.ondblclick=()=>openAdd(ds)}items.filter(x=>x.date==ds).forEach(x=>{const days=(new Date(x.date)-new Date(today))/86400000;const it=document.createElement('div');it.className=`item ${sourceClass(x.source)} ${(days>=0&&days<=7?'soon':'')}`;const prevDate=`${d.getFullYear()-1}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const prev=items.filter(p=>p.date==prevDate&&p.source==x.source).map(p=>p.variety).join('・');it.innerHTML=`<b>${displayVariety(x)}</b><span class="src">${x.source||'出荷元未入力'}${prev?`<br>去年：${prevDate} ${prev}`:''}</span>`;it.onclick=e=>{e.stopPropagation();openEdit(x.id)};it.ondblclick=e=>e.stopPropagation();el.appendChild(it)});const prevDate=`${d.getFullYear()-1}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const prevOnly=items.filter(p=>p.date==prevDate&&!items.some(x=>x.date==ds&&x.source==p.source));if(d.getMonth()==view.getMonth()&&prevOnly.length){const note=document.createElement('div');note.className='item lastyear';note.innerHTML=`<b>去年はこの日</b><span class="src">${prevOnly.map(p=>`${displayVariety(p)}／${p.source}`).join('<br>')}</span>`;el.appendChild(note)}cal.appendChild(el)}renderUpcoming()}function renderUpcoming(){const today=fmt(new Date());const up=items.filter(x=>x.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);document.getElementById('upcoming').innerHTML=up.length?up.map(x=>`<div class="uprow"><div><b>${displayVariety(x)}</b><br><span>${x.source||'出荷元未入力'}</span></div><span>${x.date}</span></div>`).join(''):'<span class="hint">今後の締切はありません</span>'}function openEdit(id){const x=items.find(i=>i.id==id);modalTitle.textContent='締切を編集';deleteBtn.classList.remove('hidden');editId.value=x.id;editSource.value=x.source;fillVarietySelect(editVariety,x.source,x.variety);editDate.value=x.date;dlg.showModal()}function openAdd(day){modalTitle.textContent='締切を追加';deleteBtn.classList.add('hidden');editId.value='';editSource.value=source.value||'';fillVarietySelect(editVariety,editSource.value,variety.value||'');editDate.value=day;dlg.showModal()}prev.onclick=()=>{view.setMonth(view.getMonth()-1);render()};next.onclick=()=>{view.setMonth(view.getMonth()+1);render()};thisMonth.onclick=()=>{view=new Date();view.setDate(1);render()};lastYear.onclick=()=>{view=new Date();view.setFullYear(view.getFullYear()-1);view.setDate(1);render()};source.onchange=()=>fillVarietySelect(variety,source.value);editSource.onchange=()=>fillVarietySelect(editVariety,editSource.value,editVariety.value);fillVarietySelect(variety,source.value);addBtn.onclick=()=>{if(!source.value){alert('出荷元を選択してください');return}if(!variety.value||!date.value){alert('品種と締切日を入力してください');return}items.push({id:Date.now().toString(),variety:variety.value,source:source.value,date:date.value});save();variety.value=source.value=date.value='';fillVarietySelect(variety,'');render()};saveBtn.onclick=()=>{if(!editSource.value){alert('出荷元を選択してください');return}if(!editVariety.value||!editDate.value){alert('品種と締切日を入力してください');return}if(editId.value){const x=items.find(i=>i.id==editId.value);x.variety=editVariety.value;x.source=editSource.value;x.date=editDate.value}else{items.push({id:Date.now().toString(),variety:editVariety.value,source:editSource.value,date:editDate.value})}save();dlg.close();render()};deleteBtn.onclick=()=>{if(!editId.value)return;items=items.filter(i=>i.id!=editId.value);save();dlg.close();render()};cancelBtn.onclick=()=>dlg.close();render();
</script>
</body>
</html>
