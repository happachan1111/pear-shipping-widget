<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梨 受注締切カレンダー</title><style>:root{--line:#e6e5e3;--text:#2c2c2b;--muted:#777;--soft:#f9f8f7;--green:#46a171;--green2:#e8f1ec;--orange:#d5803b;--blue:#2783de}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif;color:var(--text)}.wrap{max-width:980px;margin:auto;padding:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:22px;font-weight:900}.sub,.hint{font-size:12px;color:var(--muted)}button,select,input,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.month{font-weight:900;min-width:120px;text-align:center}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.dow{text-align:center;color:var(--muted);font-size:12px;font-weight:800}.day{min-height:86px;border:1px solid var(--line);border-radius:11px;padding:6px;background:#fff}.day:not(.other){cursor:copy}.day:not(.other):hover{background:var(--green2)}.other{background:var(--soft);color:#aaa}.num{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--muted)}.today{box-shadow:0 0 0 2px var(--green2) inset;border-color:var(--green)}.item{position:relative;margin-top:5px;padding:5px 24px 5px 7px;border-radius:8px;background:var(--green2);border-left:4px solid var(--green);font-size:12px;line-height:1.25;cursor:pointer}.item:hover{filter:brightness(.98)}.src{display:block;font-size:10px;color:var(--muted);margin-top:2px}.soon{outline:2px solid var(--orange);outline-offset:-2px}.lastyear{background:#e5f2fc;border-left-color:var(--blue);cursor:default}.badge{position:absolute;right:5px;top:5px;display:inline-flex;gap:2px;align-items:center;border:1px solid #c9d8ce;background:#fff;border-radius:999px;padding:1px 5px;font-size:10px;font-weight:900;color:#266546}.panel{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:14px}.card{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:12px}.add{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.uprow{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:6px}.modal{border:1px solid var(--line);border-radius:14px;padding:0;max-width:520px;width:calc(100% - 28px)}.modal::backdrop{background:rgba(0,0,0,.25)}.inner{padding:16px}.inner h3{margin:0 0 10px}.inner label{display:block;margin:10px 0 4px;font-size:12px;color:var(--muted);font-weight:800}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.danger{color:#b73a30}.comments{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.comment{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:6px}.comment b{font-size:12px}.comment p{margin:3px 0 0;white-space:pre-wrap}.hidden{display:none!important}@media(max-width:760px){.head,.panel{display:block}.add{grid-template-columns:1fr}.day{min-height:76px}.item{font-size:11px}.wrap{padding:10px}}</style></head><body><div class="wrap"><div class="head"><div><div class="title">🍐 梨 受注締切カレンダー</div><div class="sub">2025年の広岡農場予定を反映済み。予定クリックで詳細・編集・コメント登録ができます。</div></div><div class="controls"><button id="prev">‹</button><div id="monthLabel" class="month"></div><button id="next">›</button><button id="thisMonth">今月</button><button id="lastYear">去年</button><button id="show2025">2025年</button></div></div><div id="calendar" class="grid"></div><div class="panel"><div class="card"><b>締切を追加</b><div class="add" style="margin-top:8px"><select id="source"><option value="">出荷元</option><option>広岡農場</option><option>千疋屋</option><option>JAいなば</option><option>JA米子</option><option>JA琴浦</option></select><select id="variety"><option value="">品種</option></select><input id="date" type="date"><button id="addBtn">追加</button></div><div class="hint">日付をダブルクリックしても追加できます。コメント件数は予定右上の小さい吹き出しに表示されます。</div></div><div class="card"><b>直近の締切</b><div id="upcoming"></div></div></div></div><dialog id="dlg" class="modal"><div class="inner"><h3 id="modalTitle">締切詳細</h3><input type="hidden" id="editId"><label>出荷元</label><select id="editSource"><option value="">出荷元</option><option>広岡農場</option><option>千疋屋</option><option>JAいなば</option><option>JA米子</option><option>JA琴浦</option></select><label>品種</label><select id="editVariety"><option value="">品種</option></select><label>締切日</label><input id="editDate" type="date"><div class="comments"><b>コメント</b><div id="commentList"></div><label>名前</label><input id="commentName" placeholder="記入者名"><label>コメント欄</label><textarea id="commentText" rows="3" placeholder="コメントを入力"></textarea><button id="addCommentBtn" style="margin-top:8px">コメント追加</button></div><div class="actions"><button id="deleteBtn" class="danger">削除</button><button id="cancelBtn">閉じる</button><button id="saveBtn">保存</button></div></div></dialog><script>const seed=[{id:'h2025-0904',variety:'二十世紀梨',source:'広岡農場',date:'2025-09-04',comments:[]},{id:'h2025-0908',variety:'秋栄',source:'広岡農場',date:'2025-09-08',comments:[]},{id:'h2025-0915',variety:'新甘泉',source:'広岡農場',date:'2025-09-15',comments:[]},{id:'h2025-0925',variety:'二十世紀梨',source:'広岡農場',date:'2025-09-25',comments:[]},{id:'h2025-1105',variety:'あきづき',source:'広岡農場',date:'2025-11-05',comments:[]},{id:'h2025-1126',variety:'新興梨',source:'広岡農場',date:'2025-11-26',comments:[]},{id:'h2025-1225',variety:'王秋',source:'広岡農場',date:'2025-12-25',comments:[]}];const seedIds=new Set(seed.map(x=>x.id));const varieties={hirooka:['新甘泉','二十世紀梨','あきづき','秋栄','王秋','新興梨','輝太郎柿'],other:['新甘泉','二十世紀梨','秋栄','秋甘泉','王秋','あいみ燦ゴールド','輝太郎']};let stored=JSON.parse(localStorage.getItem('nashiDeadlinesV6')||localStorage.getItem('nashiDeadlinesV5')||'null');let items=stored||seed;items=items.filter(x=>!String(x.id).startsWith('h')||seedIds.has(x.id)).map(x=>({...x,comments:x.comments||[]}));seed.forEach(s=>{if(!items.some(x=>x.id===s.id))items.push({...s})});let view=new Date(2025,8,1);const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function save(){localStorage.setItem('nashiDeadlinesV6',JSON.stringify(items))}save();function list(src){return src==='広岡農場'?varieties.hirooka:(src?varieties.other:[])}function fill(sel,src,val=''){sel.innerHTML='<option value="">品種</option>'+list(src).map(v=>`<option ${v===val?'selected':''}>${v}</option>`).join('');sel.disabled=!src}function group(item){let y=item.date.slice(0,4);return items.filter(x=>x.source===item.source&&x.variety===item.variety&&x.date.slice(0,4)===y).sort((a,b)=>a.date.localeCompare(b.date))}function nameOf(x){let g=group(x),i=g.findIndex(y=>y.id===x.id);return g.length>1?`${x.variety}${['①','②','③','④','⑤'][i]||'('+ ++i +')'}`:x.variety}function render(){monthLabel.textContent=`${view.getFullYear()}年 ${view.getMonth()+1}月`;calendar.innerHTML='';['日','月','火','水','木','金','土'].forEach(x=>calendar.insertAdjacentHTML('beforeend',`<div class="dow">${x}</div>`));let start=new Date(view);start.setDate(1-start.getDay());let today=fmt(new Date());for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=fmt(d);let el=document.createElement('div');el.className='day'+(d.getMonth()!=view.getMonth()?' other':'')+(ds===today?' today':'');el.innerHTML=`<div class="num"><span>${d.getDate()}</span><span>＋</span></div>`;if(d.getMonth()==view.getMonth())el.ondblclick=()=>openAdd(ds);items.filter(x=>x.date===ds).forEach(x=>{let days=(new Date(x.date)-new Date(today))/86400000;let it=document.createElement('div');it.className='item '+(days>=0&&days<=7?'soon':'');let c=x.comments?.length||0;it.innerHTML=`<b>${nameOf(x)}</b>${c?`<span class="badge">💬${c}</span>`:''}<span class="src">${x.source}</span>`;it.onclick=e=>{e.stopPropagation();openEdit(x.id)};it.ondblclick=e=>e.stopPropagation();el.appendChild(it)});calendar.appendChild(el)}renderUpcoming()}function renderUpcoming(){let today=fmt(new Date());let up=items.filter(x=>x.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);upcoming.innerHTML=up.length?up.map(x=>`<div class="uprow"><div><b>${nameOf(x)}</b><br><span class="sub">${x.source} ${x.comments.length?`💬${x.comments.length}`:''}</span></div><span>${x.date}</span></div>`).join(''):'<div class="hint">今後の締切はありません</div>'}function commentsHtml(x){commentList.innerHTML=x.comments.length?x.comments.map(c=>`<div class="comment"><b>${escapeHtml(c.name)}</b><p>${escapeHtml(c.text)}</p></div>`).join(''):'<div class="hint">コメントなし</div>'}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openEdit(id){let x=items.find(i=>i.id===id);modalTitle.textContent='締切詳細・編集';deleteBtn.classList.remove('hidden');editId.value=x.id;editSource.value=x.source;fill(editVariety,x.source,x.variety);editDate.value=x.date;commentName.value='';commentText.value='';commentsHtml(x);dlg.showModal()}function openAdd(day){modalTitle.textContent='締切追加';deleteBtn.classList.add('hidden');editId.value='';editSource.value=source.value;fill(editVariety,editSource.value,variety.value);editDate.value=day;commentName.value='';commentText.value='';commentList.innerHTML='<div class="hint">保存後にコメントを追加できます</div>';dlg.showModal()}prev.onclick=()=>{view.setMonth(view.getMonth()-1);render()};next.onclick=()=>{view.setMonth(view.getMonth()+1);render()};thisMonth.onclick=()=>{view=new Date();view.setDate(1);render()};lastYear.onclick=()=>{view=new Date();view.setFullYear(view.getFullYear()-1);view.setDate(1);render()};show2025.onclick=()=>{view=new Date(2025,8,1);render()};source.onchange=()=>fill(variety,source.value);editSource.onchange=()=>fill(editVariety,editSource.value,editVariety.value);addBtn.onclick=()=>{if(!source.value||!variety.value||!date.value)return alert('出荷元・品種・日付を入れてください');items.push({id:Date.now().toString(),source:source.value,variety:variety.value,date:date.value,comments:[]});save();source.value=variety.value=date.value='';fill(variety,'');render()};saveBtn.onclick=()=>{if(!editSource.value||!editVariety.value||!editDate.value)return alert('出荷元・品種・日付を入れてください');if(editId.value){let x=items.find(i=>i.id===editId.value);Object.assign(x,{source:editSource.value,variety:editVariety.value,date:editDate.value})}else{items.push({id:Date.now().toString(),source:editSource.value,variety:editVariety.value,date:editDate.value,comments:[]})}save();dlg.close();render()};addCommentBtn.onclick=()=>{let id=editId.value;if(!id)return alert('先に保存してください');if(!commentName.value||!commentText.value)return alert('名前とコメントを入力してください');let x=items.find(i=>i.id===id);x.comments.push({name:commentName.value,text:commentText.value});save();commentName.value='';commentText.value='';commentsHtml(x);render()};deleteBtn.onclick=()=>{items=items.filter(i=>i.id!==editId.value);save();dlg.close();render()};cancelBtn.onclick=()=>dlg.close();fill(variety,'');render();</script></body></html>
