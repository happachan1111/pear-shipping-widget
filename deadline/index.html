<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梨 受注締切カレンダー</title><style>:root{--line:#e6e5e3;--text:#2c2c2b;--muted:#777;--soft:#f9f8f7;--green:#46a171;--green2:#e8f1ec;--orange:#d5803b;--red:#b73a30}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif;color:var(--text)}.wrap{max-width:980px;margin:auto;padding:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:22px;font-weight:900}.sub,.hint{font-size:12px;color:var(--muted)}.notice{margin-top:8px;background:#fffdf6;border:1px solid #eadcb8;border-radius:10px;padding:8px 10px;font-size:12px;max-width:620px;cursor:pointer}.noticeHead{display:flex;align-items:center;gap:6px;font-weight:900;color:#6d5524}.newBadge{display:inline-block;background:#e56458;color:#fff;border-radius:999px;padding:1px 7px;font-size:10px;font-weight:900}.noticeCount{color:var(--muted);font-weight:800}.notice ul{margin:6px 0 0;padding-left:18px}.notice li{margin:2px 0}.notice.collapsed ul li:not(:first-child){display:none}.notice.collapsed .moreHint{display:inline}.moreHint{display:none;color:var(--muted);font-size:11px;margin-left:4px}button,select,input,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:66px}.month{font-weight:900;min-width:120px;text-align:center}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.dow{text-align:center;color:var(--muted);font-size:12px;font-weight:800}.day{min-height:86px;border:1px solid var(--line);border-radius:11px;padding:6px;background:#fff}.day:not(.other){cursor:copy}.day:not(.other):hover{background:var(--green2)}.other{background:var(--soft);color:#aaa}.num{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:var(--muted)}.today{box-shadow:0 0 0 2px var(--green2) inset;border-color:var(--green)}.item{position:relative;margin-top:5px;padding:5px 31px 5px 7px;border-radius:8px;background:var(--green2);border-left:4px solid var(--green);font-size:12px;line-height:1.25;cursor:pointer}.item:hover{filter:brightness(.98)}.src{display:block;font-size:10px;color:var(--muted);margin-top:2px}.soon{outline:2px solid var(--orange);outline-offset:-2px}.badge{position:absolute;right:4px;top:4px;display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:21px;border:1px solid #b7d4c2;background:#fff;border-radius:999px;padding:0 5px;font-size:11px;font-weight:900;color:#246947;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer}.badge.zero{color:#999;border-color:#ddd}.badge:hover{background:#f0faf4}.panel{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:14px}.card{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:12px}.add{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.uprow{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:6px}.modal{border:1px solid var(--line);border-radius:14px;padding:0;max-width:520px;width:calc(100% - 28px)}.modal::backdrop{background:rgba(0,0,0,.25)}.inner{padding:16px}.inner h3{margin:0 0 10px}.inner label{display:block;margin:10px 0 4px;font-size:12px;color:var(--muted);font-weight:800}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.danger{color:var(--red)!important}.primary,#saveBtn,#saveCommentBtn{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important}.comment{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:6px;cursor:pointer}.comment:hover{border-color:#b7d4c2;background:#fbfffc}.comment b{font-size:12px}.comment p{margin:3px 0 0;white-space:pre-wrap}.hidden{display:none!important}.status{font-size:12px;color:var(--muted);margin-top:6px}@media(max-width:760px){.head,.panel{display:block}.controls{margin-top:10px}.add{grid-template-columns:1fr}.day{min-height:76px}.item{font-size:11px}.wrap{padding:10px}}</style></head><body><div class="wrap"><div class="head"><div><div class="title">🍐 梨 受注締切カレンダー</div><div class="sub">予定クリックで詳細の確認。コメントクリックでコメントの確認できます。</div><div id="status" class="status">読み込み中...</div><div class="notice collapsed" id="noticeBox"><div class="noticeHead">お知らせ <span id="newBadge" class="newBadge hidden">NEW</span><span id="noticeCount" class="noticeCount"></span><span class="moreHint">クリックで表示</span></div><div id="noticeList"></div></div></div><div class="controls"><button id="prev">‹</button><div id="monthLabel" class="month"></div><button id="next">›</button><button id="thisMonth">今月</button><button id="lastYear">去年</button></div></div><div id="calendar" class="grid"></div><div class="panel"><div class="card"><b>締切を追加</b><div class="add" style="margin-top:8px"><select id="source"><option value="">出荷元</option><option>広岡農場</option><option>千疋屋</option><option>JAいなば</option><option>JA米子</option><option>JA琴浦</option></select><select id="variety"><option value="">品種</option></select><input id="date" type="date"><button id="addBtn">追加</button></div><div class="hint">日付をダブルクリックしても追加できます。コメント件数は予定右上の吹き出しに表示されます。</div></div><div class="card"><b>直近の締切</b><div id="upcoming"></div></div></div></div><dialog id="detailDlg" class="modal"><div class="inner"><h3>締切詳細・編集</h3><input type="hidden" id="editId"><label>出荷元</label><select id="editSource"><option value="">出荷元</option><option>広岡農場</option><option>千疋屋</option><option>JAいなば</option><option>JA米子</option><option>JA琴浦</option></select><label>品種</label><select id="editVariety"><option value="">品種</option></select><label>締切日</label><input id="editDate" type="date"><div class="actions"><button id="deleteBtn" class="danger">削除</button><button id="cancelBtn">閉じる</button><button id="saveBtn">保存</button></div></div></dialog><dialog id="commentDlg" class="modal"><div class="inner"><h3 id="commentTitle">コメント</h3><input type="hidden" id="commentItemId"><input type="hidden" id="commentIndex"><div id="commentList"></div><label>名前</label><input id="commentName" placeholder="記入者名"><label>コメント</label><textarea id="commentText" rows="3" placeholder="コメントを入力"></textarea><div class="actions"><button id="deleteCommentBtn" class="danger hidden">コメント削除</button><button id="closeCommentBtn">閉じる</button><button id="clearCommentBtn">新規入力</button><button id="saveCommentBtn">コメント保存</button></div><div class="hint">既存コメントを修正・削除する場合は、上のコメントをクリックしてください。</div></div></dialog><script>const API='https://flat-disk-51b0.sasaki-8ef.workers.dev';const varieties={hirooka:['新甘泉','二十世紀梨','あきづき','秋栄','王秋','新興梨','輝太郎柿'],other:['新甘泉','二十世紀梨','秋栄','秋甘泉','王秋','あいみ燦ゴールド','輝太郎']};let items=[],activity=[],noticeOpen=false,hasNew=false,view=new Date(2025,8,1);const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;async function api(path,opt={}){let r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error(await r.text());return r.json()}async function loadData(){try{status.textContent='共有データを読み込み中...';let data=await api('/data');items=(data.items||[]).map(x=>({...x,comments:x.comments||[]}));activity=data.activity||[];status.textContent='共有データで表示中';render()}catch(e){status.textContent='読み込みエラー：'+e.message}}function list(src){return src==='広岡農場'?varieties.hirooka:(src?varieties.other:[])}function fill(sel,src,val=''){sel.innerHTML='<option value="">品種</option>'+list(src).map(v=>`<option ${v===val?'selected':''}>${v}</option>`).join('');sel.disabled=!src}function group(item){let y=item.date.slice(0,4);return items.filter(x=>x.source===item.source&&x.variety===item.variety&&x.date.slice(0,4)===y).sort((a,b)=>a.date.localeCompare(b.date))}function nameOf(x){let g=group(x),i=g.findIndex(y=>y.id===x.id);return g.length>1?`${x.variety}${['①','②','③','④','⑤'][i]||'('+ ++i +')'}`:x.variety}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderNotice(){let list=activity.slice(0,5);noticeBox.classList.toggle('collapsed',list.length>1&&!noticeOpen);noticeCount.textContent=list.length>1?`（${list.length}件）`:'';newBadge.classList.toggle('hidden',!hasNew);noticeList.innerHTML='<ul>'+list.map(a=>`<li>${esc(a.text)}</li>`).join('')+'</ul>'}noticeBox.onclick=()=>{if(activity.length>1){noticeOpen=!noticeOpen;hasNew=false;renderNotice()}};function render(){renderNotice();monthLabel.textContent=`${view.getFullYear()}年 ${view.getMonth()+1}月`;calendar.innerHTML='';['日','月','火','水','木','金','土'].forEach(x=>calendar.insertAdjacentHTML('beforeend',`<div class="dow">${x}</div>`));let start=new Date(view);start.setDate(1-start.getDay());let today=fmt(new Date());for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=fmt(d);let el=document.createElement('div');el.className='day'+(d.getMonth()!=view.getMonth()?' other':'')+(ds===today?' today':'');el.innerHTML=`<div class="num"><span>${d.getDate()}</span><span>＋</span></div>`;if(d.getMonth()==view.getMonth())el.ondblclick=()=>openAdd(ds);items.filter(x=>x.date===ds).forEach(x=>{let days=(new Date(x.date)-new Date(today))/86400000,c=x.comments?.length||0,it=document.createElement('div');it.className='item '+(days>=0&&days<=7?'soon':'');it.innerHTML=`<b>${nameOf(x)}</b><span class="badge ${c?'':'zero'}" title="コメント追加・表示">💬${c}</span><span class="src">${x.source}</span>`;it.onclick=e=>{e.stopPropagation();openEdit(x.id)};it.querySelector('.badge').onclick=e=>{e.stopPropagation();openComments(x.id)};it.ondblclick=e=>e.stopPropagation();el.appendChild(it)});calendar.appendChild(el)}renderUpcoming()}function renderUpcoming(){let today=fmt(new Date()),up=items.filter(x=>x.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);upcoming.innerHTML=up.length?up.map(x=>`<div class="uprow"><div><b>${nameOf(x)}</b><br><span class="sub">${x.source} 💬${x.comments.length}</span></div><span>${x.date}</span></div>`).join(''):'<div class="hint">今後の締切はありません</div>'}function openEdit(id){let x=items.find(i=>i.id===id);editId.value=x.id;editSource.value=x.source;fill(editVariety,x.source,x.variety);editDate.value=x.date;detailDlg.showModal()}function openAdd(day){editId.value='';editSource.value=source.value;fill(editVariety,editSource.value,variety.value);editDate.value=day;detailDlg.showModal()}function drawComments(){let x=items.find(i=>i.id===commentItemId.value);commentTitle.textContent=`コメント：${nameOf(x)}`;commentList.innerHTML=x.comments.length?x.comments.map((c,i)=>`<div class="comment" data-i="${i}"><b>${esc(c.name)}</b><p>${esc(c.text)}</p></div>`).join(''):'<div class="hint">コメントなし</div>';commentList.querySelectorAll('.comment').forEach(el=>el.onclick=()=>editComment(+el.dataset.i))}function clearCommentForm(){commentIndex.value='';commentName.value='';commentText.value='';deleteCommentBtn.classList.add('hidden')}function openComments(id){commentItemId.value=id;clearCommentForm();drawComments();commentDlg.showModal()}function editComment(i){let x=items.find(v=>v.id===commentItemId.value),c=x.comments[i];commentIndex.value=String(i);commentName.value=c.name;commentText.value=c.text;deleteCommentBtn.classList.remove('hidden')}prev.onclick=()=>{view.setMonth(view.getMonth()-1);render()};next.onclick=()=>{view.setMonth(view.getMonth()+1);render()};thisMonth.onclick=()=>{view=new Date();view.setDate(1);render()};lastYear.onclick=()=>{view=new Date();view.setFullYear(view.getFullYear()-1);view.setDate(1);render()};source.onchange=()=>fill(variety,source.value);editSource.onchange=()=>fill(editVariety,editSource.value,editVariety.value);async function refreshNew(){hasNew=true;noticeOpen=false;await loadData()}addBtn.onclick=async()=>{if(!source.value||!variety.value||!date.value)return alert('出荷元・品種・日付を入れてください');await api('/items',{method:'POST',body:JSON.stringify({source:source.value,variety:variety.value,date:date.value,comments:[]})});source.value=variety.value=date.value='';fill(variety,'');await refreshNew()};saveBtn.onclick=async()=>{if(!editSource.value||!editVariety.value||!editDate.value)return alert('出荷元・品種・日付を入れてください');let body={source:editSource.value,variety:editVariety.value,date:editDate.value,comments:[]};if(editId.value){let old=items.find(i=>i.id===editId.value);body.comments=old.comments||[];await api('/items/'+encodeURIComponent(editId.value),{method:'PUT',body:JSON.stringify(body)})}else await api('/items',{method:'POST',body:JSON.stringify(body)});detailDlg.close();await refreshNew()};deleteBtn.onclick=async()=>{await api('/items/'+encodeURIComponent(editId.value),{method:'DELETE'});detailDlg.close();await refreshNew()};cancelBtn.onclick=()=>detailDlg.close();saveCommentBtn.onclick=async()=>{let x=items.find(i=>i.id===commentItemId.value);if(!commentName.value||!commentText.value)return alert('名前とコメントを入力してください');let data={name:commentName.value,text:commentText.value};if(commentIndex.value==='')x.comments.push(data);else x.comments[+commentIndex.value]=data;await api('/items/'+encodeURIComponent(x.id)+'/comments',{method:'PUT',body:JSON.stringify({comments:x.comments})});clearCommentForm();await refreshNew();drawComments()};deleteCommentBtn.onclick=async()=>{let x=items.find(i=>i.id===commentItemId.value);if(commentIndex.value!==''){x.comments.splice(+commentIndex.value,1);await api('/items/'+encodeURIComponent(x.id)+'/comments',{method:'PUT',body:JSON.stringify({comments:x.comments})});clearCommentForm();await refreshNew();drawComments()}};clearCommentBtn.onclick=clearCommentForm;closeCommentBtn.onclick=()=>commentDlg.close();fill(variety,'');loadData();</script></body></html>
