<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>データ保管</title><link rel="stylesheet" href="./style.css?v=1"><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script></head><body><main class="app"><header><div><h1>📦 データ保管</h1><p>5年の保存期間を過ぎた全データを、Excelと添付資料のZIPにまとめます。</p></div><button id="reload">↻ 再読み込み</button></header><section class="notice"><b>安全な手順</b><span>①作成・ダウンロード → ②ファイルを開いて確認 → ③保管完了にチェック → ④元データを削除</span></section><section class="card"><div class="field"><label for="year">アーカイブ対象年度</label><select id="year"></select></div><div id="rule" class="rule"></div><div class="counts"><article><span>受注締切</span><b id="itemsCount">0</b></article><article><span>出荷時期</span><b id="timelineCount">0</b></article><article><span>受発注・掲示板等</span><b id="ordersCount">0</b></article><article><span>画像・PDF</span><b id="filesCount">0</b></article></div><button id="download" class="primary">年度別アーカイブを作成・ダウンロード</button><div id="progress" class="progress"></div></section><section class="card dangerZone"><h2>元データの削除</h2><p>ダウンロードしたZIPを開き、Excel・画像・PDFを確認して保管場所へ移動してから実行してください。</p><label class="check"><input type="checkbox" id="stored"> ダウンロードしたファイルを開き、別の場所へ保管しました</label><label class="confirmLabel">確認のため対象年を入力<input id="confirmYear" inputmode="numeric" placeholder="例：2020"></label><button id="delete" class="danger" disabled>保管済みの年度データを削除</button><div id="deleteStatus" class="progress"></div></section></main><script src="./app.js?v=1"></script></body></html>
