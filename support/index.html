<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サポートメニュー</title><link rel="stylesheet" href="./style.css?v=5"></head><body><div class="shell"><nav class="menu"><button class="active" data-view="requests">🛠<span>不具合・要望掲示板</span></button><button data-view="guides">📘<span>使い方ガイド</span></button><button data-view="archive">📦<span>データ保管</span></button></nav><main><section id="requests" class="view active"><header><div><h1>不具合・要望掲示板</h1><p>エラーや追加してほしい機能を、画像付きで共有できます。</p></div><button id="reload">↻ 更新</button></header><div class="layout"><section class="card form"><h2>新しく投稿</h2><label>お名前<input id="requester" placeholder="例：佐々木"></label><label>対象イベント<select id="event"></select></label><label>対象ツール<select id="tool"></select></label><label>種類<select id="type"><option>不具合</option><option>機能追加</option><option>改善要望</option><option>質問</option></select></label><label>件名<input id="summary" placeholder="例：右側に余白ができる"></label><label>詳しい内容<textarea id="details" placeholder="どの画面で、何をしたときに、どうなったかをご記入ください。"></textarea></label><label class="fileButton">📷 スクリーンショットを添付<input id="image" type="file" accept="image/*"></label><div id="preview" class="preview"></div><button id="send" class="primary">掲示板へ投稿</button><div id="status" class="status"></div></section><section><div class="listHead"><h2>投稿一覧</h2><select id="filter"><option value="">すべて</option><option>未確認</option><option>確認中</option><option>対応予定</option><option>対応中</option><option>完了</option><option>対応見送り</option></select></div><div id="list" class="list"></div></section></div></section><section id="guides" class="view guidesView"><iframe title="使い方ガイド" src="./guides.html?v=4"></iframe></section><section id="archive" class="view archive"><iframe title="データ保管" src="../archive/index.html?v=2"></iframe></section></main></div><script src="./app.js?v=3"></script></body></html>
