<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選果表ビューア</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f1e9}iframe{display:block;width:100%;height:100%;border:0}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script></head><body><iframe id="app" src="./index.html?v=2" title="選果表ビューア"></iframe><script>const frame=document.getElementById('app');let renderToken=0;pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';function bytesFromDataUrl(url){const b64=url.slice(url.indexOf(',')+1),bin=atob(b64),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}frame.onload=()=>{const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;const view=d.getElementById('viewer'),plus=d.getElementById('plus'),minus=d.getElementById('minus'),fit=d.getElementById('fit'),status=d.getElementById('status');if(!view||!plus||!minus||!fit)return;const style=d.createElement('style');style.textContent='.pdfPages{display:grid;gap:16px;align-content:start;margin:0 auto}.pdfPages canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 3px 14px #0003}.pdfLoading{margin:auto;padding:18px;background:#fff;border:1px solid #e7ddd1;border-radius:9px;color:#766e66}';d.head.appendChild(style);let zoom=1;function apply(){const img=view.querySelector('img'),pages=view.querySelector('.pdfPages');const width=Math.round(Math.max(320,view.clientWidth-28)*zoom);if(img){img.style.width=width+'px';img.style.minWidth=width+'px'}if(pages){pages.style.width=width+'px';pages.style.minWidth=width+'px'}}async function convert(embed){const token=++renderToken,src=embed.getAttribute('src')||embed.src;if(!src.startsWith('data:application/pdf'))return;const loading=d.createElement('div');loading.className='pdfLoading';loading.textContent='PDFを表示しています…';view.innerHTML='';view.appendChild(loading);try{const pdf=await pdfjsLib.getDocument({data:bytesFromDataUrl(src),cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/',useSystemFonts:true,disableFontFace:false}).promise;if(token!==renderToken)return;const pages=d.createElement('div');pages.className='pdfPages';view.innerHTML='';view.appendChild(pages);for(let n=1;n<=pdf.numPages;n++){if(token!==renderToken)return;const page=await pdf.getPage(n),viewport=page.getViewport({scale:1.5}),canvas=d.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);pages.appendChild(canvas);await page.render({canvasContext:ctx,viewport}).promise}apply();if(status)status.textContent='選果表を表示しています。'}catch(e){view.innerHTML='<div class="pdfLoading">PDFを表示できませんでした。外部ページで開くか、画像形式で再登録してください。</div>';if(status)status.textContent='PDFの表示に失敗しました。'}}function inspect(){const embed=view.querySelector('embed[type="application/pdf"],embed[src^="data:application/pdf"]');if(embed)convert(embed);else apply()}new MutationObserver(()=>setTimeout(inspect,20)).observe(view,{childList:true});plus.onclick=()=>{zoom=Math.min(3,zoom+.15);apply()};minus.onclick=()=>{zoom=Math.max(.5,zoom-.15);apply()};fit.onclick=()=>{zoom=1;apply();view.scrollTo({left:0,top:0})};w.addEventListener('resize',apply);setTimeout(inspect,300)};</script></body></html>
