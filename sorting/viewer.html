<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選果表ビューア</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f1e9}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="./index.html?v=2" title="選果表ビューア"></iframe><script>const frame=document.getElementById('app');frame.onload=()=>{const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;const view=d.getElementById('viewer'),plus=d.getElementById('plus'),minus=d.getElementById('minus'),fit=d.getElementById('fit'),status=d.getElementById('status');if(!view||!plus||!minus||!fit)return;let zoom=1;function apply(){const el=view.querySelector('img,embed');if(!el){if(status)status.textContent='選果表を追加すると、拡大・縮小を利用できます。';return}const width=Math.round(Math.max(320,view.clientWidth-28)*zoom);el.style.width=width+'px';el.style.minWidth=width+'px';el.style.flex='0 0 auto';if(el.tagName==='EMBED')el.style.height=Math.round(Math.max(400,view.clientHeight-28)*zoom)+'px';}plus.onclick=()=>{zoom=Math.min(3,zoom+.15);apply()};minus.onclick=()=>{zoom=Math.max(.5,zoom-.15);apply()};fit.onclick=()=>{zoom=1;apply();view.scrollTo({left:0,top:0})};new MutationObserver(()=>setTimeout(apply,50)).observe(view,{childList:true});w.addEventListener('resize',apply);setTimeout(apply,300)};</script></body></html>
