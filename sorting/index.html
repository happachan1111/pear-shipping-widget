<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>選果表ビューア</title><style>:root{--g:#5b946e;--line:#e7ddd1;--bg:#f6f1e9;--paper:#fffdf9;--muted:#766e66}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#2f2924;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Meiryo,sans-serif}.app{max-width:1180px;margin:auto;padding:16px}.head,.bar,.viewerHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-size:22px;font-weight:900}.sub,.status{font-size:12px;color:var(--muted)}.mode,.tabs,.tools{display:flex;gap:6px;flex-wrap:wrap}button,.upload,select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-weight:800;cursor:pointer}.active{background:var(--g)!important;color:#fff;border-color:var(--g)!important}.bar{margin:14px 0 8px}.tabs{border-bottom:1px solid var(--line);padding-bottom:8px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;margin-top:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 18px #4b3a2810}.viewerHead{padding:10px 12px;border-bottom:1px solid var(--line)}.viewer{height:620px;overflow:auto;display:flex;align-items:flex-start;justify-content:flex-start;padding:14px;background:#e9e5df;border-radius:0 0 14px 14px;cursor:grab;user-select:none;touch-action:none}.viewer.dragging{cursor:grabbing}.viewer img{display:block;max-width:none;box-shadow:0 3px 14px #0003}.viewer embed{width:100%;height:100%;border:0}.comments{padding:13px}.comments h3{margin:0 0 8px}.list{display:grid;gap:7px;max-height:350px;overflow:auto}.comment,.empty{background:#fbf5ec;border:1px solid var(--line);border-radius:9px;padding:9px;font-size:12px}.comment{position:relative;padding-right:30px;white-space:pre-wrap}.comment button{position:absolute;right:4px;top:4px;border:0;background:transparent;color:#b7554e;padding:3px}.comments textarea{width:100%;min-height:95px;margin-top:10px;border:1px solid var(--line);border-radius:9px;padding:9px}.primary{width:100%;margin-top:7px;background:var(--g);color:#fff;border-color:var(--g)}.upload input,.hidden{display:none!important}@media(max-width:800px){.head,.bar{display:block}.mode,.tools{margin-top:8px}.workspace{grid-template-columns:1fr}.viewer{height:480px}}</style></head><body><div class="app"><header class="head"><div><div class="title">🍐 選果表ビューア</div><div class="sub">年度とJAを選んで、全員で同じ選果表とコメントを共有します。</div></div><div id="mode" class="mode"><button data-m="this" class="active">今年</button><button data-m="last">去年</button><button data-m="all">すべて</button></div></header><div class="bar"><div><b id="yearLabel"></b><select id="yearSelect" class="hidden"></select></div><div class="tools"><button id="minus">−</button><button id="fit">全体表示</button><button id="plus">＋</button></div></div><nav id="tabs" class="tabs"></nav><main class="workspace"><section class="card"><div class="viewerHead"><b id="sheetTitle"></b><label class="upload">追加・差し替え<input id="fileInput" type="file" accept="application/pdf,image/*"></label></div><div id="viewer" class="viewer"></div></section><aside class="card comments"><h3>コメント</h3><div id="commentList" class="list"></div><textarea id="commentText" placeholder="コメントを入力"></textarea><button id="saveComment" class="primary">コメント追加</button><div id="status" class="status"></div></aside></main></div><script>const API='https://flat-disk-51b0.sasaki-8ef.workers.dev',partners=['JAいなば','JA米子','JA琴浦'],cy=new Date().getFullYear();let rows=[],active=partners[0],mv='this',zoom=1;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function year(){return mv==='last'?cy-1:+$('yearSelect').value||cy}function fileId(){return`sorting-file|${year()}|${active}`}function commentId(){return`sorting|${year()}|${active}`}function row(id){return rows.find(x=>x.id===id)}async function load(){const r=await fetch(API+'/orders/data');if(!r.ok)throw Error();rows=(await r.json()).rows||[]}function drawMode(){$('mode').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.m===mv));$('yearSelect').classList.toggle('hidden',mv!=='all');$('yearLabel').classList.toggle('hidden',mv==='all');$('yearSelect').innerHTML=[cy,cy-1,cy-2].map(y=>`<option>${y}</option>`).join('');$('yearLabel').textContent=year()+'年'}function drawTabs(){$('tabs').innerHTML=partners.map(p=>`<button data-p="${p}" class="${p===active?'active':''}">${p}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.p;drawTabs();render()})}function applyZoom(){const im=$('viewer').querySelector('img');if(im)im.style.width=Math.round(Math.max(320,$('viewer').clientWidth-28)*zoom)+'px'}function drawComments(){const a=(row(commentId())||{}).comments||[];$('commentList').innerHTML=a.length?a.map((c,i)=>`<div class="comment">${esc(typeof c==='string'?c:c.text||'')}<button data-i="${i}">×</button></div>`).join(''):'<div class="empty">コメントはありません。</div>';$('commentList').querySelectorAll('button').forEach(b=>b.onclick=async()=>{a.splice(+b.dataset.i,1);await saveComments(a);drawComments()})}async function saveComments(comments){const id=commentId(),old=row(id);if(old){await fetch(API+'/orders/rows/'+encodeURIComponent(id)+'/comments',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({comments})})}else{await fetch(API+'/orders/rows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,date:'1900-01-01',partner:'選果表:'+active,record_type:'sorting',order_count:0,ship_count:0,sheet_url:'',memo:`${year()}|${active}`,comments})})}await load()}async function saveFile(data,name,type){const id=fileId(),body={id,date:'1900-01-02',partner:'選果表ファイル:'+active,record_type:'sorting_file',order_count:0,ship_count:0,sheet_url:data,memo:JSON.stringify({year:year(),partner:active,name,type}),comments:[]},old=row(id);const url=old?API+'/orders/rows/'+encodeURIComponent(id):API+'/orders/rows';const r=await fetch(url,{method:old?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error();await load()}async function render(){drawMode();$('sheetTitle').textContent=`${active}｜${year()}年`;try{await load()}catch(e){$('status').textContent='共有データを読み込めませんでした。'}const f=row(fileId()),v=$('viewer');v.innerHTML='';if(!f||!f.sheet_url)v.innerHTML='<div class="empty">選果表は未登録です。「追加・差し替え」から登録してください。</div>';else{let meta={};try{meta=JSON.parse(f.memo||'{}')}catch(e){}if(meta.type==='application/pdf'){const e=document.createElement('embed');e.src=f.sheet_url;e.type='application/pdf';v.appendChild(e)}else{const i=document.createElement('img');i.src=f.sheet_url;i.onload=applyZoom;v.appendChild(i)}}drawComments()}$('mode').querySelectorAll('button').forEach(b=>b.onclick=()=>{mv=b.dataset.m;render()});$('yearSelect').onchange=render;$('minus').onclick=()=>{zoom=Math.max(.5,zoom-.15);applyZoom()};$('plus').onclick=()=>{zoom=Math.min(3,zoom+.15);applyZoom()};$('fit').onclick=()=>{zoom=1;applyZoom()};$('fileInput').onchange=()=>{const f=$('fileInput').files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{$('status').textContent='共有保存中…';await saveFile(rd.result,f.name,f.type);$('status').textContent='選果表を共有保存しました。';render()}catch(e){$('status').textContent='保存できませんでした。ファイルサイズを確認してください。'}};rd.readAsDataURL(f)};$('saveComment').onclick=async()=>{const t=$('commentText').value.trim();if(!t){$('status').textContent='コメントを入力してください。';return}const a=[...((row(commentId())||{}).comments||[]),{text:t}];try{await saveComments(a);$('commentText').value='';$('status').textContent='コメントを共有しました。';drawComments()}catch(e){$('status').textContent='コメントを保存できませんでした。'}};let drag=false,x=0,y=0,sx=0,sy=0;const v=$('viewer');v.onpointerdown=e=>{if(v.scrollWidth<=v.clientWidth&&v.scrollHeight<=v.clientHeight)return;drag=true;x=e.clientX;y=e.clientY;sx=v.scrollLeft;sy=v.scrollTop;v.classList.add('dragging');v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(!drag)return;v.scrollLeft=sx-(e.clientX-x);v.scrollTop=sy-(e.clientY-y)};v.onpointerup=v.onpointercancel=e=>{drag=false;v.classList.remove('dragging')};drawTabs();render();window.onresize=applyZoom;</script></body></html>
