<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta content="width=device-width,initial-scale=1" name="viewport"><title>梨掲示板</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><link href="./board.css?v=2" rel="stylesheet"></head><body>
<div class="app"><header class="head"><div><div class="title">🍐 梨掲示板</div><div class="sub">JAごとに、選果表・日程表など複数の資料を名前付きで共有できます。</div></div><div class="mode" id="mode"><button class="active" data-mode="this">今年</button><button data-mode="last">去年</button><button data-mode="all">すべて</button></div></header>
<div class="yearBar"><div><b id="yearLabel"></b><select class="hidden" id="yearSelect"></select></div><div class="docNav"><button id="prevDoc">‹ 前の資料</button><span class="navText" id="docPosition">資料なし</span><button id="nextDoc">次の資料 ›</button></div></div><nav class="tabs" id="tabs"></nav><div class="documents" id="documents"></div>
<main class="workspace"><section class="card"><div class="viewerHead"><b id="sheetTitle">資料を選択してください</b><div class="pageNav"><button id="prevPage">‹ 前ページ</button><span class="navText" id="pagePosition">1 / 1</span><button id="nextPage">次ページ ›</button></div></div><div class="viewer" id="viewer"><div class="empty">資料はまだ登録されていません。</div></div></section>
<aside class="card side"><h3>資料を追加・管理</h3><div class="notice">PDFも登録できますが、文字化けを避けて確実に表示するにはPNG・JPG画像がおすすめです。</div><div class="field"><label for="docName">資料名（自由入力）</label><input id="docName" placeholder="例：選果表、選果日程表"></div><label class="fileLabel" id="fileLabel"><span id="fileButtonText">ファイルを選択</span><input accept="application/pdf,image/*" id="fileInput" type="file"></label><div class="fileSelection" id="fileSelection" role="status" aria-live="polite">ファイルは選択されていません</div><button class="primary" id="uploadBtn">この名前で追加</button><div class="actions"><button id="renameBtn">名前を変更</button><button class="danger" id="deleteBtn">選択中の資料を削除</button></div><div class="status" id="status"></div><div class="comments"><h3>資料コメント</h3><div class="commentList" id="commentList"></div><textarea id="commentText" placeholder="この資料へのコメント"></textarea><button class="primary" id="addComment">コメント追加</button></div></aside></main></div><script src="./board.js?v=2"></script><script src="./board-manage.js?v=2"></script><script src="./pear-posts.js?v=1"></script><script src="./pear-layout.js?v=1"></script><script src="./pear-delete-fix.js?v=1"></script></body></html>
