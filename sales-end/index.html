<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梨 販売終了見込みカレンダー</title><style>:root{--text:#2c2c2b;--muted:#7d7a75;--canvas:#fff;--soft:#f9f8f7;--border:#e6e5e3;--blue:#2783de;--blue-soft:#e5f2fc;--green:#46a171;--green-soft:#e8f1ec;--orange:#d5803b;--orange-soft:#fbebde;--red:#e56458;--red-soft:#fce9e7;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.04)}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;font-size:15px;line-height:1.5}.app{max-width:1120px;margin:0 auto;padding:20px 24px 28px}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.eyebrow{color:var(--green);font-weight:700;font-size:13px;margin-bottom:2px}.title{font-size:25px;line-height:1.25;font-weight:750;letter-spacing:-.02em;margin:0}.subtitle{margin:5px 0 0;color:var(--muted);font-size:14px}.actions{display:flex;align-items:center;gap:8px}.btn{min-height:44px;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:8px;padding:0 14px;font:inherit;font-weight:650;cursor:pointer}.btn:hover{background:var(--soft)}.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(39,131,222,.25);outline-offset:2px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{filter:brightness(.96)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 12px;border:1px solid var(--border);border-radius:10px 10px 0 0;background:var(--soft)}.month-control{display:flex;align-items:center;gap:8px}.month-label{min-width:126px;text-align:center;font-size:17px;font-weight:750}.icon-btn{width:44px;height:44px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:20px;cursor:pointer}.legend{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;flex-wrap:wrap}.legend-item{display:flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%}.dot.green{background:var(--green)}.dot.orange{background:var(--orange)}.dot.red{background:var(--red)}.calendar-wrap{border:1px solid var(--border);border-top:0;border-radius:0 0 10px 10px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{background:#fff;border-bottom:1px solid var(--border)}.weekday{padding:8px 10px;text-align:center;color:var(--muted);font-size:12px;font-weight:700}.weekday:first-child{color:var(--red)}.weekday:last-child{color:var(--blue)}.day{position:relative;min-height:98px;padding:7px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:#fff;overflow:hidden}.day:nth-child(7n){border-right:0}.day.outside{background:var(--soft);color:#aaa}.day.today{box-shadow:inset 0 0 0 2px var(--blue)}.date-num{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:650;margin-bottom:4px}.today .date-num{background:var(--blue);color:#fff}.entry{display:block;width:100%;border:0;border-radius:6px;padding:5px 6px;margin-top:4px;text-align:left;font:inherit;font-size:12px;line-height:1.25;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry.forecast{background:var(--orange-soft);color:#85501f;border-left:3px solid var(--orange)}.entry.soon{background:var(--red-soft);color:#9b3b33;border-left:3px solid var(--red)}.entry.sold{background:var(--green-soft);color:#2f7250;border-left:3px solid var(--green)}.entry .status-label{font-weight:850;margin-right:5px}.entry .weight{font-weight:750}.mobile-label{display:none}.empty-note{display:none;padding:28px;text-align:center;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:16px;background:rgba(20,20,20,.38)}.modal-backdrop[hidden]{display:none!important}.modal{width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.22)}.toast{position:fixed;z-index:1100;left:50%;bottom:24px;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 14px;border-radius:8px;background:#2c2c2b;color:#fff;font-size:14px;box-shadow:var(--shadow)}.toast.warning{background:#8a4f1d}.modal h2{font-size:20px;margin:0 0 4px}.modal-intro{margin:0 0 18px;color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font:inherit;padding:10px 11px;min-height:44px}.field textarea{min-height:76px;resize:vertical}.modal-actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.right-actions{display:flex;gap:8px}.danger{color:var(--red);border-color:#f0c7c3}.hint{display:flex;align-items:flex-start;gap:8px;margin-top:12px;padding:10px 12px;background:var(--blue-soft);border-radius:8px;color:#245d8f;font-size:13px}.hint strong{white-space:nowrap}@media(max-width:720px){.app{padding:16px}.topbar{flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.toolbar{align-items:flex-start;flex-direction:column}.legend{gap:8px}.day{min-height:64px;padding:4px}.date-num{width:22px;height:22px;font-size:12px}.entry{font-size:11px;padding:3px 2px;white-space:normal;text-align:center}.entry .status-label,.entry .weight{display:none}.entry .mobile-label{display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;line-height:1.15}.entry .mobile-label small{font-size:10px;font-weight:700}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.subtitle{max-width:34em}}</style></head><body><main class="app"><header class="topbar"><div><div class="eyebrow">🍐 販売管理</div><h1 class="title">梨 販売終了見込みカレンダー</h1><p class="subtitle">商品全体の販売終了見込み・終了間近・完売確定を、出荷元の受注締切とは分けて管理します。</p></div><div class="actions"><button class="btn" id="todayBtn">今月</button><button class="btn primary" id="addBtn">＋ 予定を追加</button></div></header><section aria-label="販売終了見込みカレンダー"><div class="toolbar"><div class="month-control"><button class="icon-btn" id="prevBtn" aria-label="前月">‹</button><div class="month-label" id="monthLabel"></div><button class="icon-btn" id="nextBtn" aria-label="翌月">›</button></div><div class="legend"><span class="legend-item"><span class="dot orange"></span>販売終了見込み</span><span class="legend-item"><span class="dot red"></span>終了間近</span><span class="legend-item"><span class="dot green"></span>完売確定</span></div></div><div class="calendar-wrap"><div class="weekdays"><div class="weekday">日</div><div class="weekday">月</div><div class="weekday">火</div><div class="weekday">水</div><div class="weekday">木</div><div class="weekday">金</div><div class="weekday">土</div></div><div class="calendar" id="calendar"></div><div class="empty-note" id="emptyNote">この月の予定はありません。「予定を追加」から登録できます。</div></div><div class="hint"><strong>使い分け：</strong><span>未来の日付は「販売終了見込み」、実際に販売を止めたら「完売確定」に変更します。登録内容はこのカレンダー専用で、他のカレンダーには影響しません。</span></div></section></main><div class="modal-backdrop" id="entryModal" hidden><section class="modal" role="dialog" aria-modal="true"><h2 id="modalTitle">販売終了予定を追加</h2><p class="modal-intro">商品単位で登録してください。出荷元は複数入力できます。</p><input type="hidden" id="entryId"><div class="form-grid"><div class="field full"><label for="product">商品名・規格</label><input id="product" required placeholder="例：新甘泉 5kg"></div><div class="field"><label for="date">日付</label><input id="date" type="date" required></div><div class="field"><label for="status">状態</label><select id="status"><option value="forecast">販売終了見込み</option><option value="soon">終了間近</option><option value="sold">完売確定</option></select></div><div class="field full"><label for="sources">対象の出荷元</label><input id="sources" placeholder="例：広岡農場、JA米子、JA琴浦"></div><div class="field full"><label for="memo">備考</label><textarea id="memo" placeholder="日付の根拠や注意点"></textarea></div></div><div class="modal-actions"><button type="button" class="btn danger" id="deleteBtn">削除</button><div class="right-actions"><button type="button" class="btn" id="cancelBtn">キャンセル</button><button type="button" class="btn primary" id="saveBtn">保存</button></div></div></section></div><div class="toast" id="toast" hidden role="status" aria-live="polite"></div><script>const STORAGE_KEY='pear-sales-end-calendar-v2';const demo=[{id:'demo-1',product:'新甘泉 5kg',date:'2026-09-10',status:'forecast',sources:'広岡農場、JA米子、JA琴浦',memo:'試作用のサンプルデータです。不要ならクリックして削除できます。'}];function readEntries(){try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):demo}catch(e){return demo}}let entries=readEntries();const now=new Date();let view=new Date(now.getFullYear(),now.getMonth(),1),lastDeleted=null,toastTimer=null;const cal=document.getElementById('calendar'),monthLabel=document.getElementById('monthLabel'),modal=document.getElementById('entryModal'),toast=document.getElementById('toast');const STATUS_LABELS={forecast:'見込み',soon:'終了間近',sold:'✓ 完売'},STATUS_SHORT={forecast:'見込',soon:'間近',sold:'完売'},pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(entries));return true}catch(e){showToast('画面内には反映しました。保存領域が制限されています。',true);return false}}function showToast(message,warning=false){clearTimeout(toastTimer);toast.textContent=message;toast.classList.toggle('warning',warning);toast.hidden=false;toastTimer=setTimeout(()=>toast.hidden=true,3200)}function render(){monthLabel.textContent=`${view.getFullYear()}年 ${view.getMonth()+1}月`;cal.innerHTML='';const first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(first.getDate()-first.getDay());let visible=0;for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),cell=document.createElement('div');cell.className='day'+(d.getMonth()!==view.getMonth()?' outside':'');if(key===iso(new Date()))cell.classList.add('today');const num=document.createElement('div');num.className='date-num';num.textContent=d.getDate();cell.appendChild(num);entries.filter(e=>e.date===key).forEach(e=>{if(d.getMonth()===view.getMonth())visible++;const b=document.createElement('button');b.type='button';b.className=`entry ${e.status}`;b.title=[STATUS_LABELS[e.status],e.product,e.sources,e.memo].filter(Boolean).join('\n');b.innerHTML=`<span class="status-label">${STATUS_LABELS[e.status]}</span><span class="weight">${escapeHtml(e.product)}</span><span class="mobile-label"><span>${STATUS_SHORT[e.status]}</span><small>${escapeHtml(e.product.slice(0,2))}</small></span>`;b.onclick=()=>openEntry(e);cell.appendChild(b)});cell.ondblclick=ev=>{if(ev.target===cell||ev.target===num)openEntry({date:key})};cal.appendChild(cell)}emptyNote.style.display=visible?'none':'block'}function escapeHtml(value){const x=document.createElement('div');x.textContent=value||'';return x.innerHTML}function openEntry(e={}){entryId.value=e.id||'';product.value=e.product||'';date.value=e.date||iso(new Date(view.getFullYear(),view.getMonth(),Math.min(new Date().getDate(),28)));status.value=e.status||'forecast';sources.value=e.sources||'';memo.value=e.memo||'';modalTitle.textContent=e.id?'販売終了予定を編集':'販売終了予定を追加';deleteBtn.style.visibility=e.id?'visible':'hidden';modal.hidden=false;document.body.style.overflow='hidden';setTimeout(()=>product.focus(),0)}function closeModal(){modal.hidden=true;document.body.style.overflow=''}function saveEntry(){const p=product.value.trim(),d=date.value;if(!p){product.focus();showToast('商品名・規格を入力してください。',true);return}if(!d){date.focus();showToast('日付を入力してください。',true);return}const id=entryId.value||`e-${Date.now()}`,item={id,product:p,date:d,status:status.value,sources:sources.value.trim(),memo:memo.value.trim()},idx=entries.findIndex(e=>e.id===id);if(idx>=0)entries[idx]=item;else entries.push(item);const stored=persist();closeModal();render();if(stored)showToast('保存しました。')}function deleteEntry(){const id=entryId.value,idx=entries.findIndex(e=>e.id===id);if(idx<0)return;entries.splice(idx,1);const stored=persist();closeModal();render();if(stored)showToast('削除しました。')}saveBtn.onclick=saveEntry;deleteBtn.onclick=deleteEntry;cancelBtn.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};addBtn.onclick=()=>openEntry();prevBtn.onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};nextBtn.onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};todayBtn.onclick=()=>{const n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);render()};render();</script></body></html>
