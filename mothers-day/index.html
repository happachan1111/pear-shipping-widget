<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>イベント一覧</title>
<link rel="stylesheet" href="style-v5.css?v=1">
</head>
<body>
<section class="widget">
<header><div class="mark">📅</div><div><h1>イベント一覧</h1><p>イベントごとの予定数・予測とスケジュールをまとめて管理します。</p></div></header>
<nav class="event-tabs" aria-label="イベント切り替え"><button class="event-tab active" data-event="mother">母の日</button><button class="event-tab" data-event="father">父の日</button><button class="event-tab" data-event="aged">敬老の日</button><button class="event-tab" data-event="valentine">バレホワ</button></nav>
<nav class="main-tabs"><button class="main-tab active" data-panel="schedule">📅 スケジュール</button><button class="main-tab" data-panel="forecast">📊 予定数・予測</button><button class="main-tab" data-panel="cloud">☁️ 伝票発行クラウド</button></nav>
<main>
<section class="panel active" id="schedule"><div class="toolbar"><div id="scheduleYearButtons" class="year-buttons"></div><div class="month-controls"><button id="prevMonth">‹ 前月</button><select id="scheduleYear"></select><select id="scheduleMonth"></select><button id="nextMonth">次月 ›</button></div></div><div class="two-col"><div class="calendar-wrap"><div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendar" class="calendar"></div></div><form id="scheduleForm" class="side-form"><h2 id="scheduleFormTitle">新しい予定</h2><input id="scheduleId" type="hidden"><label>日付<input id="scheduleDate" type="date"></label><label>予定名<input id="scheduleTitle" placeholder="例：母の日の準備"></label><label>区分<select id="scheduleCategory"><option>準備</option><option>集計</option><option>その他</option></select></label><label>取引先・担当<input id="schedulePartner" placeholder="例：福田屋、坂根屋"></label><label>数量・メモ<textarea id="scheduleDetails" placeholder="数量、注意点、作業内容など"></textarea></label><label class="check"><input id="scheduleDone" type="checkbox">完了</label><div class="actions"><button id="scheduleCancel" type="button" hidden>編集をやめる</button><button id="scheduleDelete" class="delete" type="button" hidden>削除</button><button class="save" type="submit">保存</button></div><p id="scheduleStatus" class="status">読み込み中…</p></form></div></section>
<section class="panel" id="forecast" hidden><div class="forecast-head"><div><h2 id="forecastHeading">予定数・予測</h2><p>項目ごとの数を入力すると、合計・差・予測率・前年比を自動計算します。</p></div><div id="forecastYearButtons" class="year-buttons"></div></div><div class="metrics"><article><span>予定数合計</span><strong id="plannedTotal">0</strong></article><article><span>予測合計</span><strong id="forecastTotal">0</strong></article><article><span>差（予測−予定）</span><strong id="differenceTotal">0</strong></article><article><span>予測率</span><strong id="forecastRate">0%</strong></article><article><span>前年比</span><strong id="yoyRate">—</strong></article></div><div class="forecast-grid"><div class="table-wrap"><table><thead><tr><th>項目・取引先</th><th>予定数</th><th>予測</th><th>差</th></tr></thead><tbody id="forecastBody"></tbody></table><div id="forecastEmpty" class="empty" hidden>この年のデータはまだありません。</div></div><form id="forecastForm" class="side-form"><h2 id="forecastFormTitle">項目を追加</h2><input id="forecastId" type="hidden"><label>項目・取引先<input id="forecastLabel" placeholder="例：福田屋"></label><label>予定数<input id="plannedCount" type="number" min="0" step="1" value="0"></label><label>予測数<input id="forecastCount" type="number" min="0" step="1" value="0"></label><label>メモ<textarea id="forecastNote" placeholder="根拠や注意点など"></textarea></label><div class="live-calc">入力中の差：<b id="liveDifference">0</b></div><div class="actions"><button id="forecastCancel" type="button" hidden>編集をやめる</button><button id="forecastDelete" class="delete" type="button" hidden>削除</button><button class="save" type="submit">保存</button></div><p id="forecastStatus" class="status">Cloudflareへ自動保存されます</p></form></div></section>
<section class="panel" id="cloud" hidden><div class="empty large">伝票発行クラウドは準備中です。</div></section>
</main><footer>登録内容はCloudflareへ自動で共有保存されます</footer></section>
<dialog id="deleteDialog"><div><h3>削除しますか？</h3><p>削除すると、ほかの担当者の画面からも消えます。</p><div class="dialog-actions"><button id="deleteCancel" type="button">キャンセル</button><button id="deleteConfirm" class="danger" type="button">削除する</button></div></div></dialog>
<script src="app-v5.js?v=1"></script>
</body></html>
