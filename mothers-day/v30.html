<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イベント一覧</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="widget" src="index.html?event=mother&build=30"></iframe><script>const f=document.getElementById('widget');f.addEventListener('load',()=>setTimeout(async()=>{try{const d=f.contentDocument;for(const src of['invoice-history-v24-1.js','invoice-history-v24-2.js','invoice-history-v24-loader.js','valentine-import-v30.js'])await new Promise((ok,no)=>{const s=d.createElement('script');s.src=src+'?build=30';s.onload=ok;s.onerror=no;d.body.appendChild(s)});const patch=d.createElement('script');patch.textContent=`(async()=>{const history=await loadInvoiceHistoryV24(),valentineImport=await loadValentineImportV30();const rowKey=x=>[x.eventKey,x.year,x.partner,x.issueDate,x.orderMemo,x.searchTitle,x.searchKey,x.count,x.shippingDate].join('|');function addRows(rows){const keys=new Set(invoiceRows.map(rowKey));const fresh=rows.filter(x=>!keys.has(rowKey(x)));invoiceRows=[...invoiceRows,...fresh];return rows}function addHistory(eventKey){return addRows(history.filter(x=>x.eventKey===eventKey&&x.year===2025))}async function saveHistory(rows){try{const q=await api('/orders/data'),remote=new Set((q.rows||[]).map(rowKey)),missing=rows.filter(x=>!remote.has(rowKey(x)));for(let i=0;i<missing.length;i+=4){await Promise.all(missing.slice(i,i+4).map(x=>api('/orders/rows',{method:'POST',body:JSON.stringify(invoiceBody(x))}).catch(()=>null)));await new Promise(r=>setTimeout(r,250))}}catch(e){console.error(e)}}const normalRenderInvoices=renderInvoices;renderInvoices=function(){if(activeEvent!=='father')return normalRenderInvoices();const ps=['別所かまぼこ','山芳海産','シーライフ'],t=document.querySelector('#cloud .partner-tabs');$('invoiceAddRow').hidden=false;invoicePartner=ps.includes(invoicePartner)?invoicePartner:ps[0];t.innerHTML=ps.map(p=>'<button class="partner-tab '+(p===invoicePartner?'active':'')+'" data-partner="'+esc(p)+'">'+esc(p)+'</button>').join('');t.querySelectorAll('button').forEach(b=>b.onclick=()=>{invoicePartner=b.dataset.partner;renderInvoices()});fillYearSelect('invoiceYearSelect',invoiceYear,invoiceRows,y=>{invoiceYear=y;renderInvoices()});const list=invoiceRows.filter(r=>r.year===invoiceYear&&r.partner===invoicePartner).sort((a,b)=>b.issueDate.localeCompare(a.issueDate)||b.searchKey.localeCompare(a.searchKey,'ja',{numeric:true}));$('invoiceBody').innerHTML=list.map(r=>invoiceRowHtml(r)).join('');$('invoiceEmpty').hidden=!!list.length;bindInvoiceRows()};const normalLoadAll=loadAll;loadAll=async()=>{await normalLoadAll();if(activeEvent==='father'){const h=addHistory('father');invoiceYear=2025;invoicePartner='別所かまぼこ';renderInvoices();saveHistory(h)}else if(activeEvent==='aged'){const h=addHistory('aged');invoiceYear=2025;invoicePartner='福田屋';renderInvoices();saveHistory(h)}else if(activeEvent==='valentine'){const h=addRows(valentineImport);invoiceYear=2026;invoicePartner='福田屋';renderInvoices();saveHistory(h)}};const mother=addHistory('mother');invoiceYear=2025;invoicePartner='福田屋';renderInvoices();saveHistory(mother)})();`;d.body.appendChild(patch);const s=d.createElement('script');s.src='calendar-enhancements-v22.js?build=30';s.onload=()=>{const p=d.createElement('script');p.src='label-fix-v21.js?build=30';d.body.appendChild(p)};d.body.appendChild(s)}catch(e){console.error(e)}},1000))</script></body></html>
