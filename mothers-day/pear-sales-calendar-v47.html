<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梨・柿 販売終了見込み</title><style>:root{--ink:#292728;--muted:#706c6e;--line:#e4e0e1;--green:#4f8554;--soft:#edf6ee;--orange:#d5803b;--orangeSoft:#fbebde;--red:#c7433a;--redSoft:#fce9e7}*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Meiryo,sans-serif}body{padding:14px;font-size:16px}button,input,select,textarea{font:inherit}.toolbar{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:11px;background:#faf9f9;border:1px solid var(--line);border-radius:11px}.year-buttons,.month-controls,.source-tabs{display:flex;gap:7px;overflow-x:auto}.year-buttons button,.month-controls button,.month-controls select,.source-tab{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-weight:800;white-space:nowrap;cursor:pointer}.year-buttons button.active,.source-tab.active{background:var(--green);border-color:var(--green);color:#fff}.source-tabs{margin-bottom:11px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}.calendar-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));min-width:720px}.weekdays{background:#faf9f9}.weekdays span{padding:9px;text-align:center;font-size:15px;font-weight:900;color:var(--muted)}.day{min-height:112px;padding:7px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:#fff}.day:nth-child(7n){border-right:0}.day.outside{background:#fafafa}.day-number{font-size:15px;font-weight:900;color:var(--muted)}.events{display:grid;gap:4px;margin-top:5px}.event{border:0;border-left:4px solid var(--orange);border-radius:6px;background:var(--orangeSoft);padding:6px;text-align:left;font-size:13px;font-weight:800;color:#754719;cursor:pointer}.event.soon{background:var(--redSoft);border-color:var(--red);color:#8d302a}.event.sold{background:var(--soft);border-color:var(--green);color:#315f37}.event small{display:block;font-size:11px;color:var(--muted)}.side{position:sticky;top:8px;border:1px solid var(--line);border-radius:11px;padding:13px}.side h2{font-size:20px;margin:0 0 8px}.side label{display:block;margin-top:8px;font-size:14px;color:var(--muted);font-weight:800}.side input,.side select,.side textarea{width:100%;margin-top:4px;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.actions button{min-height:41px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:900;cursor:pointer}.actions .save{margin-left:auto;background:var(--green);border-color:var(--green);color:#fff}.actions .delete{color:#a33;border-color:#ebbbb7}.status{min-height:18px;font-size:14px;color:var(--muted)}@media(max-width:800px){body{padding:9px}.toolbar{flex-direction:column}.month-controls{display:grid;grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.side{position:static;order:-1}}</style></head><body><div class="toolbar"><div class="year-buttons" id="yearButtons"></div><div class="month-controls"><button id="prev">‹ 前月</button><select id="yearSelect"></select><select id="monthSelect"></select><button id="next">次月 ›</button></div></div><nav class="source-tabs" id="sourceTabs"></nav><div class="layout"><div class="calendar-wrap"><div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="calendar" id="calendar"></div></div><form class="side" id="form"><h2 id="formTitle">販売終了見込みを追加</h2><input id="id" type="hidden"><label>出荷元<select id="source"></select></label><label>商品名<select id="product"></select></label><label>規格<input id="spec" placeholder="例：5kg"></label><label>日付<input id="date" type="date" required></label><label>状態<select id="entryStatus"><option value="forecast">販売終了見込み</option><option value="soon">終了間近</option><option value="sold">完売確定</option></select></label><label>備考<textarea id="memo" rows="3"></textarea></label><div class="actions"><button id="cancel" type="button" hidden>編集をやめる</button><button class="delete" id="remove" type="button" hidden>削除</button><button class="save" type="submit">保存</button></div><p class="status" id="message"></p></form></div><script>const API='https://flat-disk-51b0.sasaki-8ef.workers.dev',TYPE='sales_end',sources=['JAいなば','JA琴浦','JA米子','千疋屋','広岡農場'],hiro=['秋栄','二十世紀梨','新甘泉','あきづき','新興梨','王秋','輝太郎柿'],other=['秋栄','二十世紀梨','新甘泉','秋甘泉','あいみ燦ゴールド','王秋','富有柿','輝太郎柿'],now=new Date();let entries=[],active='JAいなば',viewYear=now.getFullYear(),viewMonth=now.getMonth()+1;const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(p,o={}){const r=await fetch(API+p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw Error(await r.text());return r.json()}function products(s=active){return s==='広岡農場'?hiro:other}function fillProducts(){const cur=product.value;product.innerHTML='<option value="">商品名を選択</option>'+products(source.value).map(v=>`<option>${v}</option>`).join('');if([...product.options].some(o=>o.value===cur))product.value=cur}function parse(r){let m={};try{m=JSON.parse(r.memo||'{}')}catch(e){m={note:r.memo||''}}return{id:r.id,source:r.partner||sources[0],product:m.product||'商品名未設定',spec:m.spec||'',date:r.date,status:['forecast','soon','sold'].includes(m.status)?m.status:'forecast',memo:m.note||''}}function years(){return [...new Set([now.getFullYear(),now.getFullYear()-1,2026,2025,...entries.map(x=>+x.date.slice(0,4))])].sort((a,b)=>b-a)}function renderControls(){const ys=years();yearSelect.innerHTML=ys.map(y=>`<option>${y}</option>`).join('');if(!ys.includes(viewYear))yearSelect.insertAdjacentHTML('beforeend',`<option>${viewYear}</option>`);yearSelect.value=viewYear;monthSelect.innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join('');monthSelect.value=viewMonth;yearButtons.innerHTML=[now.getFullYear(),now.getFullYear()-1].map(y=>`<button type="button" data-y="${y}" class="${viewYear===y?'active':''}">${y===now.getFullYear()?'今年':'去年'}（${y}）</button>`).join('');yearButtons.querySelectorAll('button').forEach(b=>b.onclick=()=>{viewYear=+b.dataset.y;render()});sourceTabs.innerHTML=sources.map(s=>`<button type="button" class="source-tab ${s===active?'active':''}" data-s="${s}">${s}</button>`).join('');sourceTabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.s;source.value=active;fillProducts();render()})}function render(){renderControls();const first=new Date(viewYear,viewMonth-1,1),startGrid=new Date(viewYear,viewMonth-1,1-first.getDay());let html='';for(let i=0;i<42;i++){const d=new Date(startGrid);d.setDate(startGrid.getDate()+i);const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,outside=d.getMonth()!==viewMonth-1,dayItems=entries.filter(x=>x.source===active&&x.date===iso);html+=`<div class="day ${outside?'outside':''}"><div class="day-number">${d.getDate()}</div><div class="events">${dayItems.map(x=>`<button type="button" class="event ${x.status}" data-id="${esc(x.id)}">${esc(x.product)} ${esc(x.spec)}<small>${x.status==='sold'?'完売確定':x.status==='soon'?'終了間近':'販売終了見込み'}</small></button>`).join('')}</div></div>`}calendar.innerHTML=html;calendar.querySelectorAll('.event').forEach(b=>b.onclick=()=>edit(b.dataset.id))}function clearForm(){id.value='';formTitle.textContent='販売終了見込みを追加';source.value=active;fillProducts();product.value='';spec.value='';date.value=`${viewYear}-${String(viewMonth).padStart(2,'0')}-01`;entryStatus.value='forecast';memo.value='';cancel.hidden=remove.hidden=true}function edit(v){const x=entries.find(e=>e.id===v);if(!x)return;id.value=x.id;source.value=x.source;fillProducts();product.value=x.product;spec.value=x.spec;date.value=x.date;entryStatus.value=x.status;memo.value=x.memo;formTitle.textContent='編集中：'+x.product;cancel.hidden=remove.hidden=false}function msg(t){message.textContent=t;setTimeout(()=>message.textContent='',2500)}async function load(){try{const d=await api('/orders/data');entries=(d.rows||[]).filter(r=>r.record_type===TYPE).map(parse);render();if(!id.value)clearForm()}catch(e){msg('読み込みに失敗しました')}}source.innerHTML=sources.map(s=>`<option>${s}</option>`).join('');source.value=active;fillProducts();source.onchange=()=>{active=source.value;fillProducts();render()};yearSelect.onchange=()=>{viewYear=+yearSelect.value;render();clearForm()};monthSelect.onchange=()=>{viewMonth=+monthSelect.value;render();clearForm()};prev.onclick=()=>{if(--viewMonth<1){viewMonth=12;viewYear--}render();clearForm()};next.onclick=()=>{if(++viewMonth>12){viewMonth=1;viewYear++}render();clearForm()};cancel.onclick=clearForm;form.onsubmit=async e=>{e.preventDefault();if(!source.value||!product.value||!date.value)return msg('出荷元・商品名・日付を入力してください');const rowId=id.value||`sales-end|${Date.now()}-${Math.random().toString(36).slice(2,7)}`,exists=entries.some(x=>x.id===rowId),body={id:rowId,date:date.value,partner:source.value,record_type:TYPE,order_count:0,ship_count:0,sheet_url:'',memo:JSON.stringify({product:product.value,spec:spec.value.trim(),status:entryStatus.value,note:memo.value.trim()}),comments:[]};try{if(exists)await api('/orders/rows/'+encodeURIComponent(rowId),{method:'PUT',body:JSON.stringify(body)});else await api('/orders/rows',{method:'POST',body:JSON.stringify(body)});active=source.value;viewYear=+date.value.slice(0,4);viewMonth=+date.value.slice(5,7);await load();clearForm();msg('保存しました')}catch(e){msg('保存できませんでした')}};remove.onclick=async()=>{if(!id.value||!confirm('この販売終了見込みを削除しますか？'))return;try{await api('/orders/rows/'+encodeURIComponent(id.value),{method:'DELETE'});await load();clearForm();msg('削除しました')}catch(e){msg('削除できませんでした')}};load();</script></body></html>
