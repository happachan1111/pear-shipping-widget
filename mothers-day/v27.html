<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>イベント一覧</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="widget" src="index.html?event=mother&build=27"></iframe><script>const f=document.getElementById('widget');f.addEventListener('load',()=>setTimeout(async()=>{try{const d=f.contentDocument;for(const src of['invoice-history-v24-1.js','invoice-history-v24-2.js','invoice-history-v24-loader.js'])await new Promise((ok,no)=>{const s=d.createElement('script');s.src=src+'?build=27';s.onload=ok;s.onerror=no;d.body.appendChild(s)});const patch=d.createElement('script');patch.textContent=`(async()=>{const h=(await loadInvoiceHistoryV24()).filter(x=>x.eventKey==='mother'&&x.year===2025),ids=new Set(invoiceRows.map(x=>x.id));invoiceRows=[...invoiceRows,...h.filter(x=>!ids.has(x.id))];invoiceYear=2025;invoicePartner='福田屋';renderInvoices();try{const q=await api('/orders/data'),all=q.rows||[],remote=new Set(all.map(x=>x.id)),missing=h.filter(x=>!remote.has(x.id));for(let i=0;i<missing.length;i+=4){await Promise.all(missing.slice(i,i+4).map(x=>api('/orders/rows',{method:'POST',body:JSON.stringify(invoiceBody(x))}).catch(()=>null)));await new Promise(r=>setTimeout(r,250))}}catch(e){console.error(e)}})();`;d.body.appendChild(patch);const s=d.createElement('script');s.src='calendar-enhancements-v22.js?build=27';s.onload=()=>{const p=d.createElement('script');p.src='label-fix-v21.js?build=27';d.body.appendChild(p)};d.body.appendChild(s)}catch(e){console.error(e)}},1000))</script></body></html>
