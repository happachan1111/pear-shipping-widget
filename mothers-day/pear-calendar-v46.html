<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梨・柿 出荷カレンダー</title><style>:root{--ink:#292728;--muted:#706c6e;--line:#e4e0e1;--green:#4f8554;--soft:#edf6ee;--blue:#267fd1;--red:#c7433a}*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Meiryo,sans-serif}body{padding:14px;font-size:16px}button,input,select,textarea{font:inherit}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;margin-bottom:11px;background:#faf9f9;border:1px solid var(--line);border-radius:11px}.year-buttons,.month-controls,.source-tabs{display:flex;gap:7px;overflow-x:auto}.year-buttons button,.month-controls button,.month-controls select,.source-tab{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-weight:800;white-space:nowrap;cursor:pointer}.year-buttons button.active,.source-tab.active{background:var(--green);border-color:var(--green);color:#fff}.source-tabs{margin-bottom:11px}.two-col{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}.calendar-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));min-width:720px}.weekdays{background:#faf9f9}.weekdays span{padding:9px;text-align:center;font-size:15px;font-weight:900;color:var(--muted)}.day{min-height:112px;padding:7px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:#fff}.day:nth-child(7n){border-right:0}.day.outside{background:#fafafa}.day-number{font-size:15px;font-weight:900;color:var(--muted)}.events{display:grid;gap:4px;margin-top:5px}.event{border:0;border-left:4px solid var(--green);border-radius:6px;background:var(--soft);padding:6px;text-align:left;font-size:14px;font-weight:800;color:#315f37;cursor:pointer}.event.start{box-shadow:inset 0 0 0 1px #b9d4bc}.event small{display:block;font-size:11px;color:var(--muted);margin-top:2px}.side-form{position:sticky;top:8px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:13px}.side-form h2{font-size:20px;margin:0 0 8px}.side-form label{display:block;margin-top:8px;font-size:14px;color:var(--muted);font-weight:800}.side-form input,.side-form select,.side-form textarea{display:block;width:100%;margin-top:4px;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.actions button{min-height:41px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:900;cursor:pointer}.actions .save{margin-left:auto;background:var(--green);border-color:var(--green);color:#fff}.actions .delete{color:#a33;border-color:#ebbbb7}.comment-button{width:100%;margin-top:8px;min-height:41px;border:1px solid #bdd4c0;border-radius:8px;background:var(--soft);color:#315f37;font-weight:900;cursor:pointer}.comment-button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:18px;margin:7px 0 0;font-size:14px;color:var(--muted)}.empty{padding:5px;color:var(--muted);font-size:12px}dialog{width:min(520px,calc(100% - 28px));padding:0;border:1px solid var(--line);border-radius:13px}dialog::backdrop{background:rgba(0,0,0,.35)}dialog>div{padding:18px}dialog h3{margin:0 0 10px}.comment-list{display:grid;gap:7px;max-height:240px;overflow:auto}.comment{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fafafa;white-space:pre-wrap}.comment button{float:right;border:0;background:transparent;color:#a33;font-weight:900;cursor:pointer}dialog textarea{width:100%;min-height:90px;margin-top:9px;padding:9px;border:1px solid var(--line);border-radius:8px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.dialog-actions button{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:900}.dialog-actions .save-comment{background:var(--green);border-color:var(--green);color:#fff}@media(max-width:800px){body{padding:9px}.toolbar{align-items:stretch;flex-direction:column}.month-controls{display:grid;grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}.side-form{position:static;order:-1}}</style></head><body><div class="toolbar"><div class="year-buttons" id="yearButtons"></div><div class="month-controls"><button id="prevMonth">‹ 前月</button><select id="yearSelect"></select><select id="monthSelect"></select><button id="nextMonth">次月 ›</button></div></div><nav class="source-tabs" id="sourceTabs"></nav><div class="two-col"><div class="calendar-wrap"><div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="calendar" id="calendar"></div></div><form class="side-form" id="form"><h2 id="formTitle">新しい出荷時期</h2><input id="rowId" type="hidden"><label>取引先・出荷元<select id="source"></select></label><label>品種<select id="variety"></select></label><label>開始日<input id="start" type="date" required></label><label>終了日<input id="end" type="date" required></label><button class="comment-button" id="commentsBtn" type="button" disabled>💬 コメント</button><div class="actions"><button id="cancelBtn" type="button" hidden>編集をやめる</button><button class="delete" id="deleteBtn" type="button" hidden>削除</button><button class="save" type="submit">保存</button></div><p class="status" id="status"></p></form></div><dialog id="commentDialog"><div><h3 id="commentTitle">コメント</h3><div class="comment-list" id="commentList"></div><textarea id="commentText" placeholder="コメントを入力"></textarea><div class="dialog-actions"><button id="closeComment" type="button">閉じる</button><button class="save-comment" id="addComment" type="button">追加</button></div></div></dialog><script>const API='https://flat-disk-51b0.sasaki-8ef.workers.dev',now=new Date(),sources=['JAいなば','JA琴浦','JA米子','千疋屋','広岡農場'],hiro=['秋栄','新甘泉','二十世紀梨','あきづき','新興梨','王秋','輝太郎柿'],other=['秋栄','新甘泉','二十世紀梨','秋甘泉','王秋','あいみ燦ゴールド','輝太郎','富有柿'];let rows=[],active='JAいなば',viewYear=now.getFullYear(),viewMonth=now.getMonth()+1,commentId='';const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function vars(s=active){return s==='広岡農場'?hiro:other}function dateOnly(s){return new Date(s+'T00:00:00')}function fmt(s){const d=dateOnly(s);return `${d.getMonth()+1}/${d.getDate()}`}async function api(path,opt={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error(await r.text());return r.json()}function fillVariety(){const cur=$('variety').value;$('variety').innerHTML=vars($('source').value).map(v=>`<option>${v}</option>`).join('');if([...$('variety').options].some(o=>o.value===cur))$('variety').value=cur}function years(){const ys=new Set([now.getFullYear(),now.getFullYear()-1,2026,2025]);rows.forEach(r=>ys.add(+r.year));return [...ys].sort((a,b)=>b-a)}function renderControls(){const ys=years();$('yearSelect').innerHTML=ys.map(y=>`<option value="${y}">${y}年</option>`).join('');if(!ys.includes(viewYear))$('yearSelect').insertAdjacentHTML('beforeend',`<option value="${viewYear}">${viewYear}年</option>`);$('yearSelect').value=viewYear;$('monthSelect').innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join('');$('monthSelect').value=viewMonth;$('yearButtons').innerHTML=[now.getFullYear(),now.getFullYear()-1].map(y=>`<button type="button" data-y="${y}" class="${viewYear===y?'active':''}">${y===now.getFullYear()?'今年':'去年'}（${y}）</button>`).join('');$('yearButtons').querySelectorAll('button').forEach(b=>b.onclick=()=>{viewYear=+b.dataset.y;render()});$('sourceTabs').innerHTML=sources.map(s=>`<button type="button" class="source-tab ${s===active?'active':''}" data-s="${s}">${s}</button>`).join('');$('sourceTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.s;$('source').value=active;fillVariety();render()})}function visibleRows(){return rows.filter(r=>r.source===active&&+r.year===viewYear&&!+r.hidden)}function renderCalendar(){const first=new Date(viewYear,viewMonth-1,1),last=new Date(viewYear,viewMonth,0),startGrid=new Date(viewYear,viewMonth-1,1-first.getDay()),items=visibleRows();let html='';for(let i=0;i<42;i++){const day=new Date(startGrid);day.setDate(startGrid.getDate()+i);const iso=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`,outside=day.getMonth()!==viewMonth-1,events=items.filter(r=>iso>=r.start&&iso<=r.end);html+=`<div class="day ${outside?'outside':''}"><div class="day-number">${day.getDate()}</div><div class="events">${events.map(r=>`<button type="button" class="event ${iso===r.start?'start':''}" data-id="${esc(r.id)}">${esc(r.variety)}${iso===r.start?`<small>${fmt(r.start)}〜${fmt(r.end)}${(r.comments||[]).length?'　💬'+r.comments.length:''}</small>`:''}</button>`).join('')}</div></div>`}calendar.innerHTML=html;calendar.querySelectorAll('.event').forEach(b=>b.onclick=e=>{e.stopPropagation();edit(b.dataset.id)})}function render(){renderControls();renderCalendar()}function clearForm(){rowId.value='';formTitle.textContent='新しい出荷時期';source.value=active;fillVariety();start.value=`${viewYear}-${String(viewMonth).padStart(2,'0')}-01`;end.value=`${viewYear}-${String(viewMonth).padStart(2,'0')}-${String(new Date(viewYear,viewMonth,0).getDate()).padStart(2,'0')}`;cancelBtn.hidden=true;deleteBtn.hidden=true;commentsBtn.disabled=true}function edit(id){const r=rows.find(x=>x.id===id);if(!r)return;rowId.value=r.id;source.value=r.source;fillVariety();variety.value=r.variety;start.value=r.start;end.value=r.end;formTitle.textContent='編集中：'+r.variety;cancelBtn.hidden=false;deleteBtn.hidden=false;commentsBtn.disabled=false}function message(t){status.textContent=t;clearTimeout(message.t);message.t=setTimeout(()=>status.textContent='',3000)}async function load(){try{const d=await api('/timeline/data');rows=(d.rows||[]).map(r=>({...r,year:+r.year,hidden:+r.hidden||0,comments:r.comments||[]}));render();if(!rowId.value)clearForm()}catch(e){message('読み込みに失敗しました')}}source.innerHTML=sources.map(s=>`<option>${s}</option>`).join('');source.value=active;fillVariety();source.onchange=()=>{active=source.value;fillVariety();render()};yearSelect.onchange=()=>{viewYear=+yearSelect.value;render();clearForm()};monthSelect.onchange=()=>{viewMonth=+monthSelect.value;render();clearForm()};prevMonth.onclick=()=>{viewMonth--;if(viewMonth<1){viewMonth=12;viewYear--}render();clearForm()};nextMonth.onclick=()=>{viewMonth++;if(viewMonth>12){viewMonth=1;viewYear++}render();clearForm()};cancelBtn.onclick=clearForm;form.onsubmit=async e=>{e.preventDefault();if(!start.value||!end.value)return message('開始日と終了日を入力してください');if(end.value<start.value)return message('終了日は開始日以降にしてください');const old=rows.find(r=>r.id===rowId.value),year=+start.value.slice(0,4),id=rowId.value||[source.value,variety.value,year].join('|'),body={id,source:source.value,variety:variety.value,year,start:start.value,end:end.value,hidden:0,comments:old?.comments||[]};try{if(old)await api('/timeline/rows/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(body)});else await api('/timeline/rows',{method:'POST',body:JSON.stringify(body)});active=source.value;viewYear=year;viewMonth=+start.value.slice(5,7);await load();clearForm();message('保存しました')}catch(e){message('保存できませんでした')}};deleteBtn.onclick=async()=>{const r=rows.find(x=>x.id===rowId.value);if(!r||!confirm('この出荷時期を削除しますか？'))return;r.hidden=1;try{await api('/timeline/rows/'+encodeURIComponent(r.id),{method:'PUT',body:JSON.stringify(r)});await load();clearForm();message('削除しました')}catch(e){message('削除できませんでした')}};function drawComments(){const r=rows.find(x=>x.id===commentId),cs=r?.comments||[];commentList.innerHTML=cs.length?cs.map((c,i)=>`<div class="comment"><button type="button" data-i="${i}">削除</button>${esc(typeof c==='string'?c:c.text||'')}</div>`).join(''):'<div class="empty">コメントはありません。</div>';commentList.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const r=rows.find(x=>x.id===commentId);r.comments.splice(+b.dataset.i,1);await api('/timeline/rows/'+encodeURIComponent(r.id)+'/comments',{method:'PUT',body:JSON.stringify({comments:r.comments})});await load();drawComments()})}commentsBtn.onclick=()=>{commentId=rowId.value;const r=rows.find(x=>x.id===commentId);commentTitle.textContent=`コメント：${r?.variety||''}`;commentText.value='';drawComments();commentDialog.showModal()};closeComment.onclick=()=>commentDialog.close();addComment.onclick=async()=>{const text=commentText.value.trim(),r=rows.find(x=>x.id===commentId);if(!text||!r)return;r.comments=[...(r.comments||[]),{name:'',text}];await api('/timeline/rows/'+encodeURIComponent(r.id)+'/comments',{method:'PUT',body:JSON.stringify({comments:r.comments})});commentText.value='';await load();drawComments()};load();</script></body></html>
