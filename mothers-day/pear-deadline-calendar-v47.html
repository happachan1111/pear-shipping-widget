<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梨・柿 受注締切</title><style>:root{--ink:#292728;--muted:#706c6e;--line:#e4e0e1;--green:#4f8554;--soft:#edf6ee;--red:#c7433a}*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",Meiryo,sans-serif}body{padding:14px;font-size:16px}button,input,select,textarea{font:inherit}.toolbar{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;margin-bottom:11px;background:#faf9f9;border:1px solid var(--line);border-radius:11px}.year-buttons,.month-controls,.source-tabs{display:flex;gap:7px;overflow-x:auto}.year-buttons button,.month-controls button,.month-controls select,.source-tab{min-height:42px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-weight:800;white-space:nowrap;cursor:pointer}.year-buttons button.active,.source-tab.active{background:var(--green);border-color:var(--green);color:#fff}.source-tabs{margin-bottom:11px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}.calendar-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));min-width:720px}.weekdays{background:#faf9f9}.weekdays span{padding:9px;text-align:center;font-size:15px;font-weight:900;color:var(--muted)}.day{min-height:112px;padding:7px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:#fff}.day:nth-child(7n){border-right:0}.day.outside{background:#fafafa}.day-number{font-size:15px;font-weight:900;color:var(--muted)}.events{display:grid;gap:4px;margin-top:5px}.event{border:0;border-left:4px solid var(--green);border-radius:6px;background:var(--soft);padding:6px;text-align:left;font-size:14px;font-weight:800;color:#315f37;cursor:pointer}.event small{display:block;font-size:11px;color:var(--muted)}.side{position:sticky;top:8px;border:1px solid var(--line);border-radius:11px;padding:13px}.side h2{font-size:20px;margin:0 0 8px}.side label{display:block;margin-top:8px;font-size:14px;color:var(--muted);font-weight:800}.side input,.side select,.side textarea{width:100%;margin-top:4px;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.actions button,.comment-btn{min-height:41px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:900;cursor:pointer}.actions .save{margin-left:auto;background:var(--green);border-color:var(--green);color:#fff}.actions .delete{color:#a33;border-color:#ebbbb7}.comment-btn{width:100%;margin-top:8px;background:var(--soft);color:#315f37}.comment-btn:disabled{opacity:.45}.status{min-height:18px;font-size:14px;color:var(--muted)}dialog{width:min(520px,calc(100% - 28px));padding:18px;border:1px solid var(--line);border-radius:13px}dialog::backdrop{background:rgba(0,0,0,.35)}dialog h3{margin:0 0 10px}.comment-list{display:grid;gap:7px;max-height:240px;overflow:auto}.comment{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fafafa;white-space:pre-wrap}.comment button{float:right;border:0;background:transparent;color:#a33;font-weight:900}dialog textarea{width:100%;min-height:90px;margin-top:9px;padding:9px;border:1px solid var(--line);border-radius:8px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.dialog-actions button{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:900}.dialog-actions .primary{background:var(--green);color:#fff}@media(max-width:800px){body{padding:9px}.toolbar{flex-direction:column}.month-controls{display:grid;grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.side{position:static;order:-1}}</style></head><body><div class="toolbar"><div class="year-buttons" id="yearButtons"></div><div class="month-controls"><button id="prev">‹ 前月</button><select id="yearSelect"></select><select id="monthSelect"></select><button id="next">次月 ›</button></div></div><nav class="source-tabs" id="sourceTabs"></nav><div class="layout"><div class="calendar-wrap"><div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="calendar" id="calendar"></div></div><form class="side" id="form"><h2 id="formTitle">締切を追加</h2><input id="id" type="hidden"><label>出荷元<select id="source"></select></label><label>品種<select id="variety"></select></label><label>受注締切日<input id="date" type="date" required></label><button class="comment-btn" id="comments" type="button" disabled>💬 コメント</button><div class="actions"><button id="cancel" type="button" hidden>編集をやめる</button><button class="delete" id="remove" type="button" hidden>削除</button><button class="save" type="submit">保存</button></div><p class="status" id="status"></p></form></div><dialog id="commentDialog"><h3 id="commentTitle">コメント</h3><div class="comment-list" id="commentList"></div><textarea id="commentText" placeholder="コメントを入力"></textarea><div class="dialog-actions"><button id="closeComment">閉じる</button><button class="primary" id="addComment">追加</button></div></dialog><script>const API='https://flat-disk-51b0.sasaki-8ef.workers.dev',sources=['JAいなば','JA琴浦','JA米子','千疋屋','広岡農場'],hiro=['新甘泉','二十世紀梨','あきづき','秋栄','王秋','新興梨','輝太郎柿'],other=['新甘泉','二十世紀梨','秋栄','秋甘泉','王秋','あいみ燦ゴールド','輝太郎','富有柿'],now=new Date();let items=[],active='JAいなば',viewYear=now.getFullYear(),viewMonth=now.getMonth()+1,commentId='';const $=x=>document.getElementById(x),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(p,o={}){const r=await fetch(API+p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw Error(await r.text());return r.json()}function varieties(s=active){return s==='広岡農場'?hiro:other}function fillVariety(){const cur=$('variety').value;$('variety').innerHTML=varieties($('source').value).map(v=>`<option>${v}</option>`).join('');if([...$('variety').options].some(o=>o.value===cur))$('variety').value=cur}function years(){return [...new Set([now.getFullYear(),now.getFullYear()-1,2026,2025,...items.map(x=>+x.date.slice(0,4))])].sort((a,b)=>b-a)}function renderControls(){const ys=years();yearSelect.innerHTML=ys.map(y=>`<option>${y}</option>`).join('');if(!ys.includes(viewYear))yearSelect.insertAdjacentHTML('beforeend',`<option>${viewYear}</option>`);yearSelect.value=viewYear;monthSelect.innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join('');monthSelect.value=viewMonth;yearButtons.innerHTML=[now.getFullYear(),now.getFullYear()-1].map(y=>`<button type="button" data-y="${y}" class="${viewYear===y?'active':''}">${y===now.getFullYear()?'今年':'去年'}（${y}）</button>`).join('');yearButtons.querySelectorAll('button').forEach(b=>b.onclick=()=>{viewYear=+b.dataset.y;render()});sourceTabs.innerHTML=sources.map(s=>`<button type="button" class="source-tab ${s===active?'active':''}" data-s="${s}">${s}</button>`).join('');sourceTabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.s;source.value=active;fillVariety();render()})}function render(){renderControls();const first=new Date(viewYear,viewMonth-1,1),startGrid=new Date(viewYear,viewMonth-1,1-first.getDay());let html='';for(let i=0;i<42;i++){const d=new Date(startGrid);d.setDate(startGrid.getDate()+i);const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,outside=d.getMonth()!==viewMonth-1,dayItems=items.filter(x=>x.source===active&&x.date===iso);html+=`<div class="day ${outside?'outside':''}"><div class="day-number">${d.getDate()}</div><div class="events">${dayItems.map(x=>`<button type="button" class="event" data-id="${esc(x.id)}">${esc(x.variety)}<small>${x.comments?.length?'💬 '+x.comments.length:''}</small></button>`).join('')}</div></div>`}calendar.innerHTML=html;calendar.querySelectorAll('.event').forEach(b=>b.onclick=()=>edit(b.dataset.id))}function clearForm(){id.value='';formTitle.textContent='締切を追加';source.value=active;fillVariety();date.value=`${viewYear}-${String(viewMonth).padStart(2,'0')}-01`;cancel.hidden=remove.hidden=true;comments.disabled=true}function edit(v){const x=items.find(i=>i.id===v);if(!x)return;id.value=x.id;source.value=x.source;fillVariety();variety.value=x.variety;date.value=x.date;formTitle.textContent='編集中：'+x.variety;cancel.hidden=remove.hidden=false;comments.disabled=false}function msg(t){status.textContent=t;setTimeout(()=>status.textContent='',2500)}async function load(){try{const d=await api('/data');items=(d.items||[]).filter(x=>!String(x.source||'').startsWith('🦀 ')).map(x=>({...x,comments:x.comments||[]}));render();if(!id.value)clearForm()}catch(e){msg('読み込みに失敗しました')}}source.innerHTML=sources.map(s=>`<option>${s}</option>`).join('');source.value=active;fillVariety();source.onchange=()=>{active=source.value;fillVariety();render()};yearSelect.onchange=()=>{viewYear=+yearSelect.value;render();clearForm()};monthSelect.onchange=()=>{viewMonth=+monthSelect.value;render();clearForm()};prev.onclick=()=>{if(--viewMonth<1){viewMonth=12;viewYear--}render();clearForm()};next.onclick=()=>{if(++viewMonth>12){viewMonth=1;viewYear++}render();clearForm()};cancel.onclick=clearForm;form.onsubmit=async e=>{e.preventDefault();if(!source.value||!variety.value||!date.value)return;const body={source:source.value,variety:variety.value,date:date.value,comments:items.find(x=>x.id===id.value)?.comments||[]};try{if(id.value)await api('/items/'+encodeURIComponent(id.value),{method:'PUT',body:JSON.stringify(body)});else await api('/items',{method:'POST',body:JSON.stringify(body)});active=source.value;viewYear=+date.value.slice(0,4);viewMonth=+date.value.slice(5,7);await load();clearForm();msg('保存しました')}catch(e){msg('保存できませんでした')}};remove.onclick=async()=>{if(!id.value||!confirm('この締切を削除しますか？'))return;await api('/items/'+encodeURIComponent(id.value),{method:'DELETE'});await load();clearForm();msg('削除しました')};function drawComments(){const x=items.find(i=>i.id===commentId),cs=x?.comments||[];commentList.innerHTML=cs.length?cs.map((c,i)=>`<div class="comment"><button data-i="${i}">削除</button>${esc(c.text||c)}</div>`).join(''):'コメントはありません。';commentList.querySelectorAll('button').forEach(b=>b.onclick=async()=>{x.comments.splice(+b.dataset.i,1);await api('/items/'+encodeURIComponent(x.id)+'/comments',{method:'PUT',body:JSON.stringify({comments:x.comments})});await load();drawComments()})}comments.onclick=()=>{commentId=id.value;commentTitle.textContent='コメント：'+(items.find(x=>x.id===commentId)?.variety||'');commentText.value='';drawComments();commentDialog.showModal()};closeComment.onclick=()=>commentDialog.close();addComment.onclick=async()=>{const x=items.find(i=>i.id===commentId),text=commentText.value.trim();if(!x||!text)return;x.comments.push({name:'',text});await api('/items/'+encodeURIComponent(x.id)+'/comments',{method:'PUT',body:JSON.stringify({comments:x.comments})});commentText.value='';await load();drawComments()};load();</script></body></html>
