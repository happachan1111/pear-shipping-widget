<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個口数一覧</title><link rel="stylesheet" href="style.css?v=quantity-20261019"><script src="app.js?v=quantity-20261019" defer></script></head><body>
<main class="shell"><section class="top"><div><div class="eyebrow">配送・伝票作成用 / 個口数マスター連動</div><h1 class="title">個口数一覧</h1><p class="sub">この画面で追加・変更・削除。マスターへ直接保存します。</p></div><div class="tools"><label class="search"><input id="q" type="search" placeholder="商品名・取引先で検索" aria-label="商品名・取引先で検索"></label><a class="button external" href="https://happachan1111.github.io/pear-shipping-widget/koguchisu/index.html" target="_blank" rel="noopener">別画面で開く ↗</a><button id="refresh" class="button">再読み込み</button><button id="add" class="button primary" disabled>＋ 商品を追加</button></div></section>
<nav class="regions" aria-label="地域"><button class="regionTab active" data-region="山陰" aria-pressed="true"><span>山陰</span><span class="regionCount">—商品</span></button><button class="regionTab" data-region="沖縄" aria-pressed="false"><span>沖縄</span><span class="regionCount">—商品</span></button></nav><p id="regionHelp" class="regionHelp">山陰の商品を表示しています。</p><div id="regionNotice" class="status hidden" role="status"></div>
<nav class="tabs" aria-label="配送区分"><button class="tab active" data-filter="ネコポス" aria-pressed="true">📮 ネコポス</button><button class="tab" data-filter="生鮮" aria-pressed="false">🍐 生鮮</button><button class="tab" data-filter="通常" aria-pressed="false">📦 通常</button><button class="tab" data-filter="all" aria-pressed="false">すべて</button></nav>
<p id="status" class="status" role="status">マスターを読み込み中…</p><div id="error" class="status error hidden" role="alert"></div><p class="quantityHelp">「上限」は、1個口に入れられるセット数です。</p><div id="board" class="board"></div><p class="hint">変更は「マスターに保存」で反映されます。削除はNotionのマスターもゴミ箱へ移動します。ログイン不要の共有画面です。</p></main>
<dialog id="editor" class="dialog" aria-labelledby="editorTitle"><h2 id="editorTitle">商品を追加</h2><div class="fields"><label class="field wide">地域<select id="region" required><option>山陰</option><option>沖縄</option></select></label><label class="field wide">商品名<input id="name" maxlength="500" required></label><label class="field">取引先<select id="vendor" required></select></label><label class="field">区分<select id="category" required><option>ネコポス</option><option>生鮮</option><option>通常</option></select></label><label id="newVendorField" class="field wide hidden">新規取引先名<input id="newVendor" maxlength="1000"></label><label class="field">1個口最大数<input id="max" type="number" min="1" step="1"></label><label class="field">マーク<select id="mark"><option value="">なし</option><option>★</option><option>◆</option></select></label><label class="field wide">個口ルール（分割などの例外）<input id="rule" maxlength="1000"></label><label class="field wide">注意事項<textarea id="note" rows="2" maxlength="1000"></textarea></label></div><p id="saveError" class="error" role="alert"></p><div class="footer"><button id="cancel" class="button">キャンセル</button><button id="save" class="button primary">マスターに保存</button></div></dialog>
<dialog id="deleteDialog" class="dialog" aria-labelledby="deleteTitle"><h2 id="deleteTitle">この商品を削除しますか？</h2><p id="deleteName"></p><p>HTML一覧だけでなく、Notionの個口数マスターもゴミ箱に移動します。必要な場合はNotionのゴミ箱から復元できます。</p><p id="deleteError" class="error" role="alert"></p><div class="footer"><button id="deleteCancel" class="button">キャンセル</button><button id="deleteConfirm" class="button danger">削除する</button></div></dialog>
</body></html>
