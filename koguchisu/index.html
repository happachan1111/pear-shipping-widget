<!DOCTYPE html>
<html lang="ja"><head><link rel="stylesheet" href="/pear-shipping-widget/shared/ui.css?v=25"><script src="/pear-shipping-widget/shared/ui.js?v=25" data-mode="auto"></script><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>個口数一覧</title><link href="style.css?v=quantity-20261019" rel="stylesheet"/><script defer="" src="app.js?v=ui31"></script></head><body>
<main class="shell"><section class="top"><div><div class="eyebrow">配送・伝票作成用 / 個口数マスター連動</div><h1 class="title">個口数一覧</h1><p class="sub">この画面で追加・変更・削除。マスターへ直接保存します。</p></div><div class="tools"><label class="search"><input aria-label="商品名・取引先で検索" id="q" placeholder="商品名・取引先で検索" type="search"/></label><a class="button external" href="https://happachan1111.github.io/pear-shipping-widget/koguchisu/index.html" rel="noopener" target="_blank">別画面で開く ↗</a><button class="button" id="refresh">再読み込み</button><button class="button primary" disabled="" id="add">＋ 商品を追加</button></div></section>
<nav aria-label="地域" class="regions"><button aria-pressed="true" class="regionTab active" data-region="山陰"><span>山陰</span><span class="regionCount">—商品</span></button><button aria-pressed="false" class="regionTab" data-region="沖縄"><span>沖縄</span><span class="regionCount">—商品</span></button></nav><p class="regionHelp" id="regionHelp">山陰の商品を表示しています。</p><div class="status hidden" id="regionNotice" role="status"></div>
<nav aria-label="配送区分" class="tabs"><button aria-pressed="true" class="tab active" data-filter="ネコポス">📮 ネコポス</button><button aria-pressed="false" class="tab" data-filter="生鮮">🍐 生鮮</button><button aria-pressed="false" class="tab" data-filter="通常">📦 通常</button><button aria-pressed="false" class="tab" data-filter="all">すべて</button></nav>
<p class="status" id="status" role="status">マスターを読み込み中…</p><div class="status error hidden" id="error" role="alert"></div><p class="quantityHelp">「上限」は、1個口に入れられるセット数です。</p><div class="board" id="board"></div><p class="hint">変更は「マスターに保存」で反映されます。削除はNotionのマスターもゴミ箱へ移動します。ログイン不要の共有画面です。</p></main>
<dialog aria-labelledby="editorTitle" class="dialog" id="editor"><h2 id="editorTitle">商品を追加</h2><div class="fields"><label class="field wide">地域<select id="region" required=""><option>山陰</option><option>沖縄</option></select></label><label class="field wide">商品名<input id="name" maxlength="500" required=""/></label><label class="field">取引先<select id="vendor" required=""></select></label><label class="field">区分<select id="category" required=""><option>ネコポス</option><option>生鮮</option><option>通常</option></select></label><label class="field wide hidden" id="newVendorField">新規取引先名<input id="newVendor" maxlength="1000"/></label><label class="field">1個口最大数<input id="max" min="1" step="1" type="number"/></label><label class="field wide">個口ルール（分割などの例外）<input id="rule" maxlength="1000"/></label><label class="field wide">注意事項<textarea id="note" maxlength="1000" rows="2"></textarea></label></div><p class="error" id="saveError" role="alert"></p><div class="footer"><button class="button" id="cancel">キャンセル</button><button class="button primary" id="save">マスターに保存</button></div></dialog>
<dialog aria-labelledby="deleteTitle" class="dialog" id="deleteDialog"><h2 id="deleteTitle">この商品を削除しますか？</h2><p id="deleteName"></p><p>HTML一覧だけでなく、Notionの個口数マスターもゴミ箱に移動します。必要な場合はNotionのゴミ箱から復元できます。</p><p class="error" id="deleteError" role="alert"></p><div class="footer"><button class="button" id="deleteCancel">キャンセル</button><button class="button danger" id="deleteConfirm">削除する</button></div></dialog>
</body></html>
