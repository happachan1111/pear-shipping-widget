<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個口数一覧</title><style>
:root{--ink:#2c2c2b;--muted:#6f6c67;--line:#e6e5e3;--canvas:#fff;--soft:#f9f8f7;--blue:#2783de;--blueSoft:#e5f2fc;--green:#388c60;--greenSoft:#e8f1ec;--orange:#bf6b2b;--orangeSoft:#fbebde;--gray:#66635f;--graySoft:#f0efed;--danger:#c84f45}
*{box-sizing:border-box} body{margin:0;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",Arial,sans-serif;font-size:15px;line-height:1.45}
.shell{max-width:1500px;margin:auto;padding:20px 24px 32px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}.eyebrow{color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.05em}.title{font-size:28px;line-height:1.15;margin:3px 0 5px;letter-spacing:-.02em}.sub{margin:0;color:var(--muted)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search{position:relative;min-width:300px}input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:#fff;color:var(--ink);font:inherit;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(39,131,222,.12)}
.tabs{display:flex;gap:6px;background:var(--soft);border:1px solid var(--line);padding:4px;border-radius:10px;margin-bottom:16px}.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:8px 13px;border-radius:7px;cursor:pointer;min-height:38px}.tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.board{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}.column{border:1px solid var(--line);border-radius:12px;background:var(--soft);overflow:hidden;min-width:0}.column.hidden,.column.filteredOut{display:none}.colHead{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);background:#fff}.colTitle{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800}.dot{width:10px;height:10px;border-radius:50%}.count{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px}.neko .dot{background:var(--blue)}.neko .count{color:var(--blue);background:var(--blueSoft)}.fresh .dot{background:var(--green)}.fresh .count{color:var(--green);background:var(--greenSoft)}.normal .dot{background:var(--orange)}.normal .count{color:var(--orange);background:var(--orangeSoft)}
.groups{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}.vendor{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.vendor summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;padding:11px 12px;font-weight:800;min-height:44px}.vendor summary::-webkit-details-marker{display:none}.vendor summary:after{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin-right:3px}.vendor[open] summary:after{transform:rotate(225deg);margin-top:5px}.vendorN{font-size:12px;color:var(--muted);font-weight:700}.products{border-top:1px solid var(--line)}.product{padding:10px 12px;border-bottom:1px solid var(--line)}.product:last-child{border-bottom:0}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}.name{font-weight:650;overflow-wrap:anywhere}.mark{color:#8b6508;margin-right:3px}.guide{font-size:12px;font-weight:850;white-space:nowrap;border-radius:7px;padding:4px 7px;color:var(--blue);background:var(--blueSoft)}.fresh .guide{color:var(--green);background:var(--greenSoft)}.normal .guide{color:var(--orange);background:var(--orangeSoft)}.note{margin-top:6px;color:var(--danger);font-size:12px;font-weight:700}.empty{padding:28px 16px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:4px}.noResults{display:none;margin-top:20px;padding:32px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
@media(max-width:900px){.top{align-items:stretch;flex-direction:column}.search{min-width:0;width:100%}.board{grid-template-columns:1fr}.groups{grid-template-columns:1fr}.shell{padding:16px}.tabs{overflow:auto}.column.filteredOut{display:none}}
@media(prefers-color-scheme:dark){:root{--ink:#fff;--muted:rgba(255,255,255,.65);--line:rgba(255,255,255,.18);--canvas:#191919;--soft:#202020;--blue:#5e9fe8;--blueSoft:rgba(94,159,232,.13);--green:#72bc8f;--greenSoft:rgba(114,188,143,.13);--orange:#de9255;--orangeSoft:rgba(222,146,85,.13);--danger:#e97366}.colHead,.vendor,input,.tab.active{background:#202020}.column{background:#191919}.tabs{background:#191919}}

body{font-size:16px}.shell{max-width:1200px}.eyebrow,.guide,.note,.vendorN,.count{font-size:14px}.tab{min-height:44px}.button{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--canvas);color:var(--ink);font:inherit;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{color:var(--danger)}.button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.button:disabled{opacity:.5;cursor:wait}.productActions{display:flex;gap:8px;margin-top:8px}.status{padding:12px 16px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;font-size:14px}.error{color:var(--danger)}.hidden{display:none!important}.dialog{border:1px solid var(--line);border-radius:12px;padding:24px;width:min(580px,calc(100% - 32px));max-height:90vh;background:var(--canvas);color:var(--ink)}.dialog::backdrop{background:rgba(0,0,0,.4)}.dialog h2{margin:0 0 16px;font-size:22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px}.wide{grid-column:1/-1}select,textarea{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--canvas);color:var(--ink);font:inherit;min-height:44px}textarea{resize:vertical}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hint{font-size:14px;color:var(--muted)}.guide{white-space:normal;max-width:200px}.tools{gap:8px}.search{min-width:240px}@media(max-width:600px){.fields{grid-template-columns:1fr}.dialog{padding:16px}.tools{width:100%}.row{grid-template-columns:1fr}.guide{width:fit-content}.search{width:100%}}
.tab{white-space:nowrap;flex-shrink:0}@media(max-width:600px){.tab{padding:8px 10px}.footer{position:sticky;bottom:-16px;background:var(--canvas);padding:12px 0;border-top:1px solid var(--line)}}

@media(max-width:600px){.tabs{gap:4px}.tab{padding:8px;font-size:14px}}
</style></head><body>
<main class="shell"><section class="top"><div><div class="eyebrow">配送・伝票作成用 / 個口数マスター連動</div><h1 class="title">個口数一覧</h1><p class="sub">この画面で追加・変更・削除。マスターへ直接保存します。</p></div><div class="tools"><label class="search"><input id="q" type="search" placeholder="商品名・取引先で検索" aria-label="商品名・取引先で検索"></label><button id="refresh" class="button">再読み込み</button><button id="add" class="button primary" disabled>＋ 商品を追加</button></div></section>
<nav class="tabs" aria-label="配送区分"><button class="tab active" data-filter="ネコポス" aria-pressed="true">📮 ネコポス</button><button class="tab" data-filter="生鮮" aria-pressed="false">🍐 生鮮</button><button class="tab" data-filter="通常" aria-pressed="false">📦 通常</button><button class="tab" data-filter="all" aria-pressed="false">すべて</button></nav>
<p id="status" class="status" role="status">マスターを読み込み中…</p><div id="error" class="status error hidden" role="alert"></div><div id="board" class="board"></div><p class="hint">変更は「マスターに保存」で反映されます。削除はNotionのマスターもゴミ箱へ移動します。ログイン不要の共有画面です。</p></main>
<dialog id="editor" class="dialog" aria-labelledby="editorTitle"><h2 id="editorTitle">商品を追加</h2><div class="fields"><label class="field wide">商品名<input id="name" maxlength="500" required></label><label class="field">取引先<select id="vendor" required></select></label><label class="field">区分<select id="category" required><option>ネコポス</option><option>生鮮</option><option>通常</option></select></label><label id="newVendorField" class="field wide hidden">新規取引先名<input id="newVendor" maxlength="1000"></label><label class="field">1個口最大数<input id="max" type="number" min="1" step="1"></label><label class="field">マーク<select id="mark"><option value="">なし</option><option>★</option><option>◆</option></select></label><label class="field wide">個口ルール（分割などの例外）<input id="rule" maxlength="1000"></label><label class="field wide">注意事項<textarea id="note" rows="2" maxlength="1000"></textarea></label></div><p id="saveError" class="error" role="alert"></p><div class="footer"><button id="cancel" class="button">キャンセル</button><button id="save" class="button primary">マスターに保存</button></div></dialog>
<dialog id="deleteDialog" class="dialog" aria-labelledby="deleteTitle"><h2 id="deleteTitle">この商品を削除しますか？</h2><p id="deleteName"></p><p>HTML一覧だけでなく、Notionの個口数マスターもゴミ箱に移動します。必要な場合はNotionのゴミ箱から復元できます。</p><p id="deleteError" class="error" role="alert"></p><div class="footer"><button id="deleteCancel" class="button">キャンセル</button><button id="deleteConfirm" class="button danger">削除する</button></div></dialog>
<script>'use strict';
const $=id=>document.getElementById(id),TYPES=[['ネコポス','neko','📮'],['生鮮','fresh','🍐'],['通常','normal','📦']];
let rows=[],vendors=[],filter='ネコポス',query='',editing=null,deleting=null,busy=false,loaded=false,refreshSeq=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s+/g,'');
const vendorOf=r=>r.vendor==='新しい取引先を入力'?r.newVendor||'取引先名を確認':r.vendor||'取引先未設定';
function status(text){$('status').textContent=text}function error(text){$('error').textContent=text;$('error').classList.toggle('hidden',!text)}
const API_BASE='https://koguchisu.sasaki-8ef.workers.dev/api';
async function api(path,options={}){const res=await fetch(API_BASE+path,{credentials:'omit',cache:'no-store',redirect:'error',...options,headers:{'Content-Type':'application/json',...options.headers}});let data;try{data=await res.json()}catch{throw Error('接続先を確認できませんでした。画面を再読み込みしてください。')}if(!res.ok)throw Error(data.error||'処理できませんでした。');return data;}
function choose(value){filter=value;document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.filter===value;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});render()}
function render(){const openState=new Map([...document.querySelectorAll('details[data-group]')].map(d=>[d.dataset.group,d.open]));$('board').innerHTML=TYPES.filter(([t])=>filter==='all'||filter===t).map(([type,cls,icon])=>{const subset=rows.filter(r=>r.category===type&&(!query||norm([r.name,vendorOf(r),r.note,r.rule].join(' ')).includes(query)));const groups=new Map();subset.forEach(r=>{const v=vendorOf(r);if(!groups.has(v))groups.set(v,[]);groups.get(v).push(r)});return `<section class="column ${cls}"><header class="colHead"><div class="colTitle"><span class="dot"></span>${icon} ${type}</div><span class="count">${subset.length}商品</span></header><div class="groups">${[...groups].sort(([a],[b])=>a.localeCompare(b,'ja')).map(([v,items])=>{const key=type+'|'+v;return `<details class="vendor" data-group="${esc(key)}" ${openState.get(key)===false?'':'open'}><summary><span>${esc(v)}</span><span class="vendorN">${items.length}商品</span></summary><div class="products">${items.sort((a,b)=>a.name.localeCompare(b.name,'ja')).map(r=>`<article class="product"><div class="row"><div class="name"><span class="mark">${esc(r.mark)}</span>${esc(r.name||'商品名未設定')}</div><div class="guide">${esc(r.rule||(r.max?'伝票1枚に '+r.max+'セットまで':'要確認'))}</div></div>${r.note?`<div class="note">⚠ ${esc(r.note)}</div>`:''}<div class="productActions"><button class="button" data-edit="${esc(r.id)}" aria-label="${esc(r.name)}を編集">編集</button><button class="button danger" data-delete="${esc(r.id)}" aria-label="${esc(r.name)}を削除">削除</button></div></article>`).join('')}</div></details>`}).join('')||`<div class="empty"><strong>${query?'該当する商品がありません':loaded?'登録商品なし':'読み込み中'}</strong>${loaded?'「商品を追加」から登録できます。':''}</div>`}</div></section>`}).join('');if(filter==='all'){const unknown=rows.filter(r=>!TYPES.some(([t])=>t===r.category));if(unknown.length){const wrap=document.createElement('section');wrap.className='column';wrap.innerHTML='<header class="colHead"><strong>区分未設定・要確認</strong></header><div class="groups">'+unknown.filter(r=>!query||norm(r.name+' '+vendorOf(r)).includes(query)).map(r=>`<article class="product"><strong>${esc(r.name)}</strong><p>${esc(vendorOf(r))}</p><button class="button" data-edit="${esc(r.id)}">編集</button><button class="button danger" data-delete="${esc(r.id)}">削除</button></article>`).join('')+'</div>';$('board').appendChild(wrap)}}}
async function load(quiet=false){if(busy)return;const seq=++refreshSeq;if(!quiet)status('マスターを読み込み中…');try{const data=await api('/products');if(seq!==refreshSeq)return;rows=data.rows||[];vendors=data.vendors||[];loaded=true;$('add').disabled=false;error('');render();status(data.complete===false?'一部の商品のみ表示しています。全件を取得できていません。':'マスター接続済み / '+rows.length+'商品 / '+new Date(data.loadedAt).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo'})+'更新')}catch(e){if(seq!==refreshSeq)return;error(e.message);status(loaded?'更新に失敗しました。表示中の内容が古い可能性があります。':'マスターに接続できていません。')}}
function vendorFields(){$('newVendorField').classList.toggle('hidden',$('vendor').value!=='新しい取引先を入力')}
function edit(id){editing=rows.find(r=>r.id===id)||null;const r=editing||{name:'',vendor:'',newVendor:'',category:filter==='all'?'ネコポス':filter,max:'',rule:'',note:'',mark:''};$('editorTitle').textContent=editing?'商品を編集':'商品を追加';const opts=[...new Set([...vendors,...rows.map(r=>r.vendor)])].filter(v=>v&&v!=='新しい取引先を入力').sort((a,b)=>a.localeCompare(b,'ja'));$('vendor').innerHTML='<option value="">選んでください</option>'+opts.map(v=>`<option>${esc(v)}</option>`).join('')+'<option>新しい取引先を入力</option>';for(const k of ['name','vendor','newVendor','category','max','rule','note','mark'])$(k).value=r[k]??'';vendorFields();$('saveError').textContent='';$('editor').showModal();$('name').focus()}
function setBusy(value){busy=value;for(const id of ['save','cancel','deleteConfirm','deleteCancel','add','refresh'])$(id).disabled=value||id==='add'&&!loaded;$('save').textContent=value?'保存中…':'マスターに保存'}
async function save(){if(busy)return;const d={};for(const k of ['name','vendor','newVendor','category','max','rule','note','mark'])d[k]=$(k).value.trim();if(!d.name||!d.vendor||!d.category)return $('saveError').textContent='商品名・取引先・区分は必須です。';if(d.vendor==='新しい取引先を入力'&&!d.newVendor)return $('saveError').textContent='新規取引先名を入力してください。';if(d.max!==''&&(!Number.isSafeInteger(Number(d.max))||Number(d.max)<1))return $('saveError').textContent='1個口最大数は1以上の整数で入力してください。';if(!d.max&&!d.rule)return $('saveError').textContent='1個口最大数または個口ルールを入力してください。';d.max=d.max===''?null:Number(d.max);if(editing)d.updatedAt=editing.updatedAt;++refreshSeq;setBusy(true);try{const data=await api('/products'+(editing?'/'+encodeURIComponent(editing.id):''),{method:editing?'PUT':'POST',body:JSON.stringify(d)});rows=editing?rows.map(r=>r.id===editing.id?data.row:r):[...rows,data.row];$('editor').close();query='';$('q').value='';choose(d.category);status('マスターに保存しました。');error('')}catch(e){$('saveError').textContent=e.message}finally{setBusy(false)}}
function askDelete(id){deleting=rows.find(r=>r.id===id);if(!deleting)return;$('deleteName').textContent=vendorOf(deleting)+' / '+deleting.name;$('deleteError').textContent='';$('deleteDialog').showModal();$('deleteCancel').focus()}
async function remove(){if(busy||!deleting)return;++refreshSeq;setBusy(true);try{await api('/products/'+encodeURIComponent(deleting.id),{method:'DELETE',body:JSON.stringify({updatedAt:deleting.updatedAt})});rows=rows.filter(r=>r.id!==deleting.id);$('deleteDialog').close();render();status('マスターから削除しました。Notionのゴミ箱から復元できます。')}catch(e){$('deleteError').textContent=e.message}finally{setBusy(false)}}
$('board').onclick=e=>{const button=e.target.closest('button');if(button?.dataset.edit)edit(button.dataset.edit);if(button?.dataset.delete)askDelete(button.dataset.delete)};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>choose(b.dataset.filter));$('q').oninput=e=>{query=norm(e.target.value);render()};$('add').onclick=()=>edit();$('refresh').onclick=()=>load();$('vendor').onchange=vendorFields;$('save').onclick=save;$('cancel').onclick=()=>$('editor').close();$('deleteCancel').onclick=()=>$('deleteDialog').close();$('deleteConfirm').onclick=remove;for(const dialog of [$('editor'),$('deleteDialog')])dialog.addEventListener('cancel',e=>{if(busy)e.preventDefault()});
const initialType=new URLSearchParams(location.search).get('type');if([...TYPES.map(([t])=>t),'all'].includes(initialType))choose(initialType);
load();setInterval(()=>{if(!document.hidden&&!$('editor').open&&!$('deleteDialog').open)load(true)},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('editor').open&&!$('deleteDialog').open)load(true)})
</script></body></html>
