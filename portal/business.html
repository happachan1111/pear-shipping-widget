<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>業務情報</title><link rel="stylesheet" href="business.css?v=2"><script defer src="business-seeds.js?v=3"></script><script defer src="business.js?v=5"></script></head><body><main><header><div><h1>業務情報</h1><p>キャンセル対応や日々の業務情報を共有します。</p></div><div class="actions"><button id="reload" type="button">更新</button><button class="primary" id="add" type="button" disabled>＋ 情報を追加</button></div></header><p class="caution">掲載内容は誰でも見られます。個人情報やパスワードは入力しないでください。移行した対応は、使う前に最新の条件をご確認ください。</p><section class="toolbar"><label>検索<input id="search" type="search" placeholder="取引先・内容で検索"></label><label>区分<select id="filter"><option value="all">すべて</option><option value="event">イベント</option><option value="other">通常</option></select></label></section><p id="status" role="status">読み込み中…</p><div id="list" class="list"></div><p id="empty" hidden>該当する情報はありません。</p></main><dialog id="editor" aria-labelledby="dialogTitle"><form id="form"><div class="dialogHeader"><h2 id="dialogTitle">業務情報</h2><button type="button" id="close" aria-label="閉じる">×</button></div><div class="fields"><label>取引先<input id="partner" maxlength="100" required></label><label>区分<select id="kind"><option value="event">イベント</option><option value="other">通常</option></select></label><label>見出し<input id="title" maxlength="150" required placeholder="例：キャンセル対応"></label><label>対応内容<textarea id="details" rows="9" maxlength="10000" required></textarea></label></div><p class="caution">閲覧制限はありません。個人情報やパスワードは記載しないでください。</p><p id="formStatus" role="status"></p><div class="dialogActions"><button type="button" id="delete" class="danger" hidden>削除</button><button type="button" id="cancel">閉じる</button><button class="primary" id="save" type="submit">保存</button></div></form></dialog></body></html>
