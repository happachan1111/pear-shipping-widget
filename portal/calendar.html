<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>運営カレンダー</title><link rel="stylesheet" href="calendar.css?v=2"><script src="calendar.js?v=2" defer></script></head><body><main class="calendarApp"><header class="calendarHeader"><div><p class="eyebrow">TEARLUM PORTAL</p><h1>運営カレンダー</h1><p class="lead">母の日・父の日・敬老の日・バレンタイン・ホワイトデーの予定を、ひとつに。</p></div><div class="headerActions"><button id="reload">再読み込み</button><button class="primary" id="add">＋ 予定を追加</button></div></header><section class="controls" aria-label="表示する予定"><div class="monthControls"><button id="prev" aria-label="前月">‹</button><h2 id="monthTitle"></h2><button id="next" aria-label="次月">›</button><button id="today">今月</button><input type="month" id="month" aria-label="表示年月"></div><div class="filters"><label>イベント<select id="eventFilter"><option value="all">すべて</option><option value="mother">母の日</option><option value="father">父の日</option><option value="aged">敬老の日</option><option value="valentine">バレンタイン</option><option value="white">ホワイトデー</option></select></label><label class="searchLabel">検索<input id="search" type="search" placeholder="予定名・取引先で検索"></label><div class="viewButtons" aria-label="表示形式"><button id="gridView" aria-pressed="true">月表示</button><button id="listView" aria-pressed="false">一覧</button></div></div></section><p id="status" role="status">共有データを読み込んでいます…</p><div id="legend" class="legend" aria-label="イベントの色分け"></div><section id="gridSection" aria-label="月の予定"><div class="weekdays" aria-hidden="true"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendar" class="calendar"></div></section><section id="listSection" hidden aria-label="予定の一覧"><div id="agenda"></div></section><p id="empty" class="empty" hidden>この条件の予定はありません。</p><p class="footnote">予定を選ぶと編集できます。既存の共有データと連動します。取り込み済みの初期予定も表示しています。</p><button id="support" class="support">サポートメニュー</button></main>
<dialog id="editDialog"><form id="editForm"><div class="dialogHeader"><h2 id="editTitle">予定を追加</h2><button type="button" id="close" aria-label="閉じる">×</button></div><div class="formBody"><label>イベント<select id="event" required><option value="mother">母の日</option><option value="father">父の日</option><option value="aged">敬老の日</option><option value="valentine">バレンタイン</option><option value="white">ホワイトデー</option></select></label><label>日付<input id="date" type="date" required></label><label class="full">予定名<input id="title" required maxlength="300"></label><label>区分<select id="category"><option>準備</option><option>集計</option><option>その他</option></select></label><label>取引先・担当<input id="partner" list="partnerOptions"><datalist id="partnerOptions"></datalist></label><label class="full">数量・メモ<textarea id="details" rows="4"></textarea></label><section id="commentsArea" class="full"><h3>コメント</h3><div id="comments"></div><label>コメントを追加<textarea id="commentText" rows="2" placeholder="保存時に追加されます"></textarea></label></section><p id="formStatus" class="full" role="status"></p></div><div class="formFooter"><button type="button" class="danger" id="delete" hidden>削除</button><button type="button" id="cancel">キャンセル</button><button type="submit" class="primary" id="save">保存</button></div></form></dialog>
<dialog id="supportDialog" class="supportDialog"><div class="dialogHeader"><h2>サポートメニュー</h2><button id="supportClose" aria-label="閉じる">閉じる</button></div><iframe title="既存のサポートメニュー" id="supportFrame"></iframe></dialog></body></html>
