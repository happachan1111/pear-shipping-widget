<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梨 発注・出荷件数カレンダー</title><style>:root{--text:#2c2c2b;--muted:#777;--line:#e6e5e3;--soft:#f9f8f7;--green:#46a171;--red:#e56458;--blue:#2783de}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',Meiryo,sans-serif;color:var(--text);background:#fff}.wrap{max-width:1180px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:20px;font-weight:900}.guide{margin-top:8px;padding:10px 12px;border:1px solid #dbe8df;background:#fbfffc;border-radius:12px;font-size:13px;font-weight:900;color:#246947}.noticeBox{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}.noticeHead{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px;font-weight:900;cursor:pointer}.newBadge{display:inline-block;background:#f05f4f;color:#fff;border-radius:999px;padding:2px 7px;font-size:10px}.noticeList{display:none;border-top:1px solid var(--line);padding:8px 10px;font-size:12px;color:#5f5c57}.noticeBox.open .noticeList{display:block}.noticeItem{padding:4px 0;border-bottom:1px dashed #eee}.noticeItem:last-child{border-bottom:0}.status,.hint{font-size:12px;color:var(--muted)}select,input,textarea{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px;width:100%}button{border:0;border-radius:9px;color:#fff;font-weight:900;padding:9px;cursor:pointer}.main{display:grid;grid-template-columns:1fr 280px;gap:10px;margin-top:10px}.board,.editor,.listBox{border:1px solid var(--line);border-radius:14px;padding:12px}.calHead{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px;font-weight:900;color:#5f5c57;margin-bottom:6px}.calHead div{text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:104px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px;cursor:pointer}.day.other{background:#fafafa;color:#aaa}.day.today{border-color:#8bc9a5;background:#fbfffc}.num{font-size:12px;font-weight:900;margin-bottom:4px}.entry{font-size:11px;background:#f2f8f4;border:1px solid #d8ebdf;border-radius:7px;padding:4px;margin-top:3px;line-height:1.35}.entry b{display:block}.totals{margin-top:8px;font-size:13px;font-weight:900}.form{display:grid;gap:7px}.save{background:var(--green)}.delete{background:var(--red)}.clear{background:#8f8b85}.commentBtn{background:#fff;border:1px solid #b7d4c2;color:#266546;border-radius:999px;padding:5px 8px;font-size:12px}.listBox{margin-top:10px}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px}.pill{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px;cursor:pointer}.empty{padding:18px;background:var(--soft);border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}.modal{border:1px solid var(--line);border-radius:14px;padding:0;max-width:520px;width:calc(100% - 28px)}.modal::backdrop{background:rgba(0,0,0,.25)}.inner{padding:16px}.inner h3{margin:0 0 10px}.inner label{display:block;margin:10px 0 4px;font-size:12px;color:var(--muted);font-weight:800}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.comment{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:6px;cursor:pointer}.comment p{margin:3px 0 0;white-space:pre-wrap}.modal button{background:#8f8b85}.modal .primary,#saveCommentBtn{background:var(--green)!important}.danger{color:#b73a30!important}.hidden{display:none!important}@media(max-width:900px){.main{grid-template-columns:1fr}.list{grid-template-columns:1fr}.day{min-height:92px}.top{display:block}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">🍐 梨 発注・出荷件数カレンダー</div><div class="guide">取引先ごとの発注件数・出荷件数・差数・集計表URL・メモを記録できます。コメントは名前と内容を入れて、後から編集・削除できます。<div id="noticeBox" class="noticeBox"><div id="noticeHead" class="noticeHead">お知らせ <span id="newBadge" class="newBadge hidden">NEW</span><span id="noticeSummary" class="status">共有データを読み込み中...</span></div><div id="noticeList" class="noticeList"></div></div></div></div><div style="display:flex;gap:8px"><select id="yearPick"></select><select id="monthPick"></select></div></div><div class="main"><div class="board"><div class="calHead"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="calendar" class="calendar"></div><div id="totals" class="totals"></div></div><aside class="editor"><b id="formTitle">記録追加・編集</b><div class="form" style="margin-top:8px"><input type="hidden" id="rowId"><label class="hint">日付</label><input id="date" type="date"><label class="hint">取引先</label><select id="partner"></select><label class="hint">発注件数</label><input id="orderCount" type="number" min="0" value="0"><label class="hint">出荷件数</label><input id="shipCount" type="number" min="0" value="0"><label class="hint">集計表URL・場所</label><input id="sheetUrl" placeholder="URL、ファイル名、回覧名など"><label class="hint">メモ</label><textarea id="memo" rows="3" placeholder="遅延、変更、確認事項など"></textarea><button class="save" id="saveBtn">保存</button><button class="delete" id="deleteBtn">削除</button><button class="clear" id="clearBtn">選択解除</button><div id="msg" class="hint"></div></div></aside></div><section class="listBox"><b id="listTitle">表示中リスト</b><div id="list" class="list"></div></section></div><dialog id="commentDlg" class="modal"><div class="inner"><h3 id="commentTitle">コメント</h3><input type="hidden" id="commentIndex"><div id="commentList"></div><label>名前</label><input id="commentName" placeholder="記入者名"><label>コメント</label><textarea id="commentText" rows="3" placeholder="コメントを入力"></textarea><div class="actions"><button id="deleteCommentBtn" class="danger hidden">コメント削除</button><button id="closeCommentBtn">閉じる</button><button id="clearCommentBtn">新規入力</button><button id="saveCommentBtn" class="primary">コメント保存</button></div><div class="hint">既存コメントを修正・削除する場合は、上のコメントをクリックしてください。</div></div></dialog><script>const API='https://flat-disk-51b0.sasaki-8ef.workers.dev';const partners=['広岡農場','JAいなば','JA琴浦','JA米子','千疋屋'];let rows=[],activity=[],commentId='';const now=new Date();function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function md(x){let d=new Date(x+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`}async function api(path,opt={}){let r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw new Error(await r.text());return r.json()}function setNotice(t,n=false){noticeSummary.textContent=t;newBadge.classList.toggle('hidden',!n)}function renderNotice(){let a=(activity||[]).slice(0,5);if(!a.length){noticeList.innerHTML='<div class="noticeItem">お知らせはまだありません。</div>';return}noticeList.innerHTML=a.map(x=>`<div class="noticeItem">${esc(x.text)}</div>`).join('');setNotice(a[0].text,true)}async function loadData(){try{setNotice('共有データを読み込み中...',false);let d=await api('/orders/data');rows=(d.rows||[]).map(x=>({...x,order_count:+x.order_count||0,ship_count:+x.ship_count||0,comments:x.comments||[]}));activity=d.activity||[];renderNotice();render()}catch(e){setNotice('読み込みエラー：'+e.message,false)}}function setup(){partner.innerHTML=partners.map(p=>`<option>${p}</option>`).join('');let y=now.getFullYear();yearPick.innerHTML=[y+1,y,y-1].map(v=>`<option value="${v}">${v}年</option>`).join('');yearPick.value=y;monthPick.innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join('');monthPick.value=now.getMonth()+1;date.value=`${y}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`}function monthRows(){let ym=`${yearPick.value}-${String(monthPick.value).padStart(2,'0')}`;return rows.filter(r=>(r.date||'').startsWith(ym)).sort((a,b)=>a.date.localeCompare(b.date)||a.partner.localeCompare(b.partner))}function render(){let y=+yearPick.value,m=+monthPick.value,first=new Date(y,m-1,1),start=new Date(first);start.setDate(1-first.getDay());let html='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,same=d.getMonth()===m-1,dayRows=rows.filter(r=>r.date===iso);html+=`<div class="day ${same?'':'other'} ${iso===new Date().toISOString().slice(0,10)?'today':''}" data-date="${iso}"><div class="num">${d.getDate()}</div>${dayRows.slice(0,3).map(r=>`<div class="entry" data-id="${r.id}"><b>${esc(r.partner)}</b>発${r.order_count} / 出${r.ship_count} / 差${r.order_count-r.ship_count} 💬${(r.comments||[]).length}</div>`).join('')}${dayRows.length>3?`<div class="hint">他${dayRows.length-3}件</div>`:''}</div>`}calendar.innerHTML=html;calendar.querySelectorAll('.day').forEach(el=>el.onclick=e=>{let ent=e.target.closest('.entry');if(ent){edit(rows.find(r=>r.id===ent.dataset.id));e.stopPropagation()}else{clearForm();date.value=el.dataset.date}});let mr=monthRows(),o=mr.reduce((s,r)=>s+r.order_count,0),sh=mr.reduce((s,r)=>s+r.ship_count,0);totals.textContent=`月合計：発注 ${o}件 / 出荷 ${sh}件 / 差 ${o-sh}件`;listTitle.textContent=`${yearPick.value}年${monthPick.value}月リスト`;list.innerHTML=mr.length?mr.map(r=>`<div class="pill" data-id="${r.id}"><b>${md(r.date)} ${esc(r.partner)}</b><br>発注 ${r.order_count} / 出荷 ${r.ship_count} / 差 ${r.order_count-r.ship_count}<br>${r.sheet_url?`📊 ${esc(r.sheet_url)}<br>`:''}${r.memo?`📝 ${esc(r.memo)}<br>`:''}<button class="commentBtn" data-cid="${r.id}" type="button">💬${(r.comments||[]).length}</button></div>`).join(''):'<div class="empty">データなし</div>';list.querySelectorAll('.pill').forEach(p=>p.onclick=e=>{if(e.target.dataset.cid){openComments(rows.find(r=>r.id===e.target.dataset.cid));e.stopPropagation()}else edit(rows.find(r=>r.id===p.dataset.id))})}function edit(r){rowId.value=r.id;date.value=r.date;partner.value=r.partner;orderCount.value=r.order_count;shipCount.value=r.ship_count;sheetUrl.value=r.sheet_url||'';memo.value=r.memo||'';formTitle.textContent='編集中：'+r.partner}function clearForm(){rowId.value='';partner.value=partners[0];orderCount.value=0;shipCount.value=0;sheetUrl.value='';memo.value='';formTitle.textContent='記録追加・編集'}function showMsg(t){msg.textContent=t;setTimeout(()=>msg.textContent='',2200)}saveBtn.onclick=async()=>{if(!date.value)return showMsg('日付を入れてください');let id=rowId.value||[date.value,partner.value,Date.now()].join('|'),body={id,date:date.value,partner:partner.value,order_count:+orderCount.value||0,ship_count:+shipCount.value||0,sheet_url:sheetUrl.value,memo:memo.value,comments:(rows.find(r=>r.id===id)||{}).comments||[]};if(rowId.value)await api('/orders/rows/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(body)});else await api('/orders/rows',{method:'POST',body:JSON.stringify(body)});showMsg('保存しました');await loadData();clearForm()};deleteBtn.onclick=async()=>{if(!rowId.value)return showMsg('削除する記録を選択してください');await api('/orders/rows/'+encodeURIComponent(rowId.value),{method:'DELETE'});showMsg('削除しました');await loadData();clearForm()};clearBtn.onclick=clearForm;yearPick.onchange=render;monthPick.onchange=render;noticeHead.onclick=()=>noticeBox.classList.toggle('open');function openComments(r){commentId=r.id;commentTitle.textContent=`コメント：${r.date} ${r.partner}`;commentName.value='';commentText.value='';commentIndex.value='';deleteCommentBtn.classList.add('hidden');drawComments();commentDlg.showModal()}function drawComments(){let r=rows.find(x=>x.id===commentId),arr=(r&&r.comments)||[];commentList.innerHTML=arr.length?arr.map((c,i)=>`<div class="comment" data-i="${i}"><b>${esc(c.name)}</b><p>${esc(c.text)}</p></div>`).join(''):'<div class="hint">コメントなし</div>';commentList.querySelectorAll('.comment').forEach(el=>el.onclick=()=>{let c=arr[+el.dataset.i];commentIndex.value=el.dataset.i;commentName.value=c.name;commentText.value=c.text;deleteCommentBtn.classList.remove('hidden')})}saveCommentBtn.onclick=async()=>{let r=rows.find(x=>x.id===commentId);if(!r)return;if(!commentName.value||!commentText.value)return alert('名前とコメントを入力してください');r.comments=r.comments||[];let data={name:commentName.value,text:commentText.value};if(commentIndex.value==='')r.comments.push(data);else r.comments[+commentIndex.value]=data;await api('/orders/rows/'+encodeURIComponent(r.id)+'/comments',{method:'PUT',body:JSON.stringify({comments:r.comments})});commentName.value='';commentText.value='';commentIndex.value='';deleteCommentBtn.classList.add('hidden');await loadData();drawComments()};deleteCommentBtn.onclick=async()=>{let r=rows.find(x=>x.id===commentId);if(r&&commentIndex.value!==''){r.comments.splice(+commentIndex.value,1);await api('/orders/rows/'+encodeURIComponent(r.id)+'/comments',{method:'PUT',body:JSON.stringify({comments:r.comments})});commentName.value='';commentText.value='';commentIndex.value='';deleteCommentBtn.classList.add('hidden');await loadData();drawComments()}};clearCommentBtn.onclick=()=>{commentIndex.value='';commentName.value='';commentText.value='';deleteCommentBtn.classList.add('hidden')};closeCommentBtn.onclick=()=>commentDlg.close();setup();loadData();</script></body></html>
