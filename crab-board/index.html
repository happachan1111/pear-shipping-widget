<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カニ掲示板</title>
<link rel="stylesheet" href="./style.css?v=2">
</head>
<body>
<div class="app">
<header class="header">
<div><div class="title">🦀 カニ掲示板</div><div class="subtitle">文字投稿と画像資料を分けて共有できます。</div></div>
<button id="refreshBtn" class="iconBtn" type="button">↻ 更新</button>
</header>
<nav id="tabs" class="tabs" aria-label="取引先の絞り込み"></nav>
<section class="yearBar" aria-label="表示する年">
<div id="quickYears" class="quickYears"></div>
<label class="yearSelectLabel">年を選択<select id="yearSelect"></select></label>
</section>
<section class="composer card">
<div class="composerTitle">新しい投稿</div>
<label class="label" for="partnerSelect">取引先・出荷元</label>
<select id="partnerSelect"></select>
<label class="label" for="postText">内容</label>
<textarea id="postText" rows="4" placeholder="共有したい内容を入力してください。文字だけの投稿もできます。"></textarea>
<div id="imagePreview" class="imagePreview hidden"></div>
<div class="composerActions">
<label class="imageButton">📷 画像を追加<input id="imageInput" type="file" accept="image/*"></label>
<button id="removeImageBtn" class="secondary hidden" type="button">画像を外す</button>
<button id="publishBtn" class="primary" type="button">投稿する</button>
</div>
<div id="status" class="status"></div>
</section>
<main id="feed" class="feed" aria-live="polite"></main>
</div>
<dialog id="imageDialog" class="imageDialog"><button id="closeImageDialog" type="button">閉じる</button><img id="dialogImage" alt="投稿画像"></dialog>
<script src="./app.js?v=3"></script>
<script src="./crab-layout.js?v=1"></script>
</body>
</html>
